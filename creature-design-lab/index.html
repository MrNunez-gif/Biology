      const SYNERGIES = [
        {ids:['fur','colony'], tags:['cold'], value:5, label:'Shared insulation'},
        {ids:['hunter','pack'], tags:['prey','predators'], value:5, label:'Coordinated hunting'},
        {ids:['scavenger','smell'], tags:['scarcity','urban'], value:4, label:'Resource tracking'},
        {ids:['membrane','swimmer'], tags:['wet','flood'], value:5, label:'Aquatic respiration'},
        {ids:['shell','burrower'], tags:['debris'], value:4, label:'Reinforced shelter'},
        {ids:['tiny','glider'], tags:['vertical','flood'], value:4, label:'Low-mass gliding'},
        {ids:['scales','reservoir'], tags:['heat','arid'], value:5, label:'Desert water control'},
        {ids:['echo','climber'], tags:['dark','vertical','debris'], value:4, label:'Three-dimensional mapping'},
        {ids:['filters','scavenger'], tags:['toxins','urban','disease'], value:4, label:'Safe salvage'},
        {ids:['repair','massive'], tags:['predators','debris','storm'], value:4, label:'Damage tolerance'}
      ];

      const NAME_PARTS = {
        first:['Astra','Velo','Mira','Kryo','Nexo','Terra','Zyra','Orin','Cinder','Luma','Rift','Echo','Nova','Vanta','Brine','Talon'],
        second:['morph','drake','fin','claw','wing','stride','shell','lynx','mite','runner','grazer','shade','crest','stalker','weaver','back']
      };

      let savedRun = loadRun();
      let currentView = 'home';
      let simulationBusy = false;
      let simulationText = '';
      let toastTimer = null;

      const screen = document.getElementById('screen');
      const topStatus = document.getElementById('topStatus');
      const modalRoot = document.getElementById('modalRoot');
      const toast = document.getElementById('toast');

      function freshRun() {
        return {
          version: 2,
          phase: 'build',
          buildStep: 0,
          selections: {},
          speciesName: generateName(),
          worlds: [],
          worldIndex: 0,
          situationIndex: 0,
          currentClaim: null,
          selectedEvidence: [],
          selectedReasoning: null,
          scenarioResults: [],
          worldReports: [],
          stats: {population:72, energy:72, resources:55},
          createdAt: Date.now(),
          completed: false,
          sceneTransition: false
        };
      }

      function loadRun() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.version !== 2 || !parsed.phase) return null;
          parsed.selectedEvidence = Array.isArray(parsed.selectedEvidence) ? parsed.selectedEvidence : [];
          parsed.scenarioResults = Array.isArray(parsed.scenarioResults) ? parsed.scenarioResults : [];
          parsed.worldReports = Array.isArray(parsed.worldReports) ? parsed.worldReports : [];
          parsed.stats = parsed.stats || {population:72,energy:72,resources:55};
          return parsed;
        } catch (error) {
          return null;
        }
      }

      function saveRun() {
        if (!savedRun) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRun)); }
        catch (error) { showToast('Progress could not be saved in this browser.'); }
      }

      function clearRun() {
        savedRun = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch (error) {}
      }

      function generateName() {
        const a = NAME_PARTS.first[Math.floor(Math.random() * NAME_PARTS.first.length)];
        const b = NAME_PARTS.second[Math.floor(Math.random() * NAME_PARTS.second.length)];
        return a + b;
      }

      function getOption(id) {
        for (const category of CATEGORIES) {
          const option = category.options.find(item => item.id === id);
          if (option) return option;
        }
        return null;
      }

      function selectedOptions(run = savedRun) {
        if (!run) return [];
        return CATEGORIES.map(category => getOption(run.selections[category.id])).filter(Boolean);
      }

      function spentBudget(run = savedRun) {
        return selectedOptions(run).reduce((sum, option) => sum + option.cost, 0);
      }

      function completedCategories(run = savedRun) {
        if (!run) return 0;
        return CATEGORIES.filter(category => run.selections[category.id]).length;
      }

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
      }

      function setView(view) {
        currentView = view;
        window.scrollTo({top:0, behavior:'smooth'});
        render();
      }

      function render() {
        updateHeader();
        if (currentView === 'home') renderHome();
        else if (!savedRun) { currentView = 'home'; renderHome(); }
        else if (currentView === 'build') renderBuilder();
        else if (currentView === 'trial') renderTrial();
        else if (currentView === 'trialResult') renderTrialResult();
        else if (currentView === 'worldResult') renderWorldResult();
        else if (currentView === 'final') renderFinal();
        else renderHome();
      }

      function updateHeader() {
        let text = 'Offline expedition • Progress saves automatically';
        if (savedRun && currentView !== 'home') {
          if (currentView === 'build') text = `Genome sequence • ${completedCategories()}/7 traits • ${spentBudget()}/${BIO_BUDGET} bio-points`;
          if (currentView === 'trial') text = `${savedRun.speciesName} • World ${Math.min(savedRun.worldIndex + 1, 3)}/3 • Situation ${Math.min(savedRun.situationIndex + 1, 3)}/3`;
          if (currentView === 'trialResult') text = `${savedRun.speciesName} • CER consequence • Population ${Math.round(savedRun.stats.population)}%`;
          if (currentView === 'worldResult') text = `${savedRun.speciesName} • World ${Math.min(savedRun.worldIndex + 1, 3)} field report`;
          if (currentView === 'final') text = `${savedRun.speciesName} • CER expedition complete`;
        }
        topStatus.innerHTML = `<div class="status-pill"><span class="status-dot"></span><span>${escapeHTML(text)}</span></div>`;
        document.getElementById('restartButton').style.visibility = savedRun ? 'visible' : 'hidden';
      }

      function renderHome() {
        const demoSelections = {
          body:'balanced', surface:'scales', movement:'climber', feeding:'omnivore',
          sense:'echo', social:'pair', special:'camouflage'
        };
        const hasRun = Boolean(savedRun);
        const resumeLabel = savedRun?.completed ? 'View final report' : 'Continue expedition';
        const resumeMeta = savedRun ? `${escapeHTML(savedRun.speciesName)} • ${describeProgress(savedRun)}` : '';
        screen.innerHTML = `
          <section class="home-grid">
            <div class="home-copy">
              <p class="eyebrow">CER Wildworld Expedition</p>
              <h1 class="home-title">DESIGN.<br><span>ARGUE.</span><br>ADAPT.</h1>
              <p class="home-lede">Build a species, then guide it through nine connected survival situations. Every decision uses Claim, Evidence, and Reasoning—and every choice changes the population, resources, and path forward.</p>
              <div class="home-actions">
                <button class="primary-btn" data-action="new-run">Start New Expedition</button>
                <button class="secondary-btn" data-action="how">How It Works</button>
              </div>
              ${hasRun ? `<div class="resume-card"><div><strong>${resumeMeta}</strong><span>Saved on this device</span></div><button class="small-btn" data-action="continue">${resumeLabel}</button></div>` : ''}
              <div class="feature-row">
                <span class="feature-chip">24 habitat situations</span>
                <span class="feature-chip">9 CER decisions per run</span>
                <span class="feature-chip">Choices alter later scenes</span>
                <span class="feature-chip">No dead ends</span>
              </div>
            </div>
            <div class="tank-wrap" aria-hidden="true">
              <div class="tank-glow"></div>
              <div class="tank">
                <span class="tank-label">Specimen preview / awaiting field protocol</span>
                ${renderCreatureSVG(demoSelections, 'home')}
              </div>
            </div>
          </section>`;
      }

      function describeProgress(run) {
        if (run.completed || run.phase === 'final') return 'completed expedition';
        if (run.phase === 'build') return `${completedCategories(run)}/7 traits selected`;
        if (run.phase === 'worldResult') return `world ${Math.min(run.worldIndex + 1,3)} report`;
        return `world ${Math.min(run.worldIndex + 1,3)} • situation ${Math.min(run.situationIndex + 1,3)}`;
      }

      function renderBuilder() {
        const step = clamp(savedRun.buildStep, 0, CATEGORIES.length);
        const reviewMode = step >= CATEGORIES.length;
        const used = spentBudget();
        const remaining = BIO_BUDGET - used;
        const over = remaining < 0;
        const completion = completedCategories();
        const category = CATEGORIES[Math.min(step, CATEGORIES.length - 1)];

        screen.innerHTML = `
          <section class="builder-shell">
            <div class="panel builder-main">
              <div class="builder-topline">
                <div>
                  <div class="step-kicker">${reviewMode ? 'Genome review' : `Sequence ${step + 1} of ${CATEGORIES.length}`}</div>
                  <h2>${reviewMode ? 'Finalize the species' : escapeHTML(category.label)}</h2>
                  <p>${reviewMode ? 'Every trait is locked to the same biological budget. Change any category before release.' : escapeHTML(category.prompt)}</p>
                </div>
                <div class="budget-box" aria-label="Biological budget">
                  <div class="budget-line"><span>Bio-points used</span><strong>${used} / ${BIO_BUDGET}</strong></div>
                  <div class="budget-bar"><div class="budget-fill ${over ? 'over' : ''}" style="width:${clamp((used / BIO_BUDGET) * 100, 0, 100)}%"></div></div>
                  <div class="budget-line" style="margin-top:7px"><span>${over ? 'Over budget' : 'Energy reserve'}</span><strong class="${over ? 'negative' : 'positive'}">${over ? Math.abs(remaining) : remaining}</strong></div>
                </div>
              </div>
              ${renderCategoryNav(step)}
              ${reviewMode ? renderGenomeReview(used, remaining) : renderTraitSelection(category)}
              <div class="builder-footer">
                <div class="builder-footer-group">
                  <button class="ghost-btn" data-action="builder-back" ${step === 0 ? 'disabled' : ''}>Back</button>
                  <button class="secondary-btn" data-action="randomize">Randomize Genome</button>
                </div>
                <div class="builder-footer-group">
                  ${reviewMode
                    ? `<button class="primary-btn" data-action="launch" ${completion < CATEGORIES.length || over ? 'disabled' : ''}>Begin Wildworld Trials</button>`
                    : `<button class="primary-btn" data-action="builder-next" ${!savedRun.selections[category.id] ? 'disabled' : ''}>${step === CATEGORIES.length - 1 ? 'Review Genome' : 'Next Trait'}</button>`}
                </div>
              </div>
            </div>
            <aside class="panel preview-panel">
              <div class="preview-stage">${renderCreatureSVG(savedRun.selections, 'builder')}</div>
              <div class="genome-summary">
                <div class="summary-row"><span>Species</span><strong>${escapeHTML(savedRun.speciesName)}</strong></div>
                <div class="summary-row"><span>Genome completion</span><strong>${completion} / 7</strong></div>
                <div class="summary-row"><span>Energy reserve</span><strong class="${over ? 'negative' : ''}">${remaining}</strong></div>
              </div>
            </aside>
          </section>`;
      }

      function renderCategoryNav(activeStep) {
        return `<nav class="category-nav" aria-label="Genome categories">${CATEGORIES.map((category, index) => {
          const done = Boolean(savedRun.selections[category.id]);
          return `<button class="category-step ${index === activeStep ? 'active' : ''} ${done ? 'done' : ''}" data-action="jump-step" data-step="${index}">
            <span class="step-number">${done ? '✓' : index + 1}</span>
            <span>${escapeHTML(category.label)}</span>
          </button>`;
        }).join('')}</nav>`;
      }

      function renderTraitSelection(category) {
        return `<div class="trait-grid">${category.options.map(option => {
          const selected = savedRun.selections[category.id] === option.id;
          return `<button class="trait-card ${selected ? 'selected' : ''}" data-action="select-trait" data-category="${category.id}" data-option="${option.id}" aria-pressed="${selected}">
            <div class="trait-head"><h3>${escapeHTML(option.name)}</h3><span class="cost-chip">${option.cost} BP</span></div>
            <p>${escapeHTML(option.desc)}</p>
            <div class="trait-effects">
              ${option.good.map(text => `<span class="effect-good">+ ${escapeHTML(text)}</span>`).join('')}
              ${option.bad.map(text => `<span class="effect-bad">− ${escapeHTML(text)}</span>`).join('')}
            </div>
          </button>`;
        }).join('')}</div>`;
      }

      function renderGenomeReview(used, remaining) {
        return `
          <div class="review-grid">
            ${CATEGORIES.map((category, index) => {
              const option = getOption(savedRun.selections[category.id]);
              return `<button class="review-trait" data-action="jump-step" data-step="${index}"><span>${escapeHTML(category.label)}</span><strong>${option ? escapeHTML(option.name) : 'Not selected'}</strong></button>`;
            }).join('')}
          </div>
          <div class="name-field">
            <label for="speciesName">Species name</label>
            <div class="name-row">
              <input id="speciesName" maxlength="24" value="${escapeHTML(savedRun.speciesName)}" autocomplete="off" />
              <button class="small-btn" data-action="new-name">Generate</button>
            </div>
          </div>
          ${remaining < 0
            ? `<div class="warning-box"><strong>Genome exceeds the biological budget by ${Math.abs(remaining)} point${Math.abs(remaining) === 1 ? '' : 's'}.</strong> Replace one or more expensive traits before release.</div>`
            : `<div class="info-box"><strong>${remaining} reserve point${remaining === 1 ? '' : 's'} available.</strong> Unused bio-points become stored energy and provide a small survival bonus in every habitat.</div>`}
        `;
      }

      function randomizeGenome() {
        let attempts = 0;
        let selections;
        do {
          selections = {};
          CATEGORIES.forEach(category => {
            selections[category.id] = category.options[Math.floor(Math.random() * category.options.length)].id;
          });
          attempts++;
        } while (spentBudget({selections}) > BIO_BUDGET && attempts < 200);
        savedRun.selections = selections;
        savedRun.speciesName = generateName();
        savedRun.buildStep = CATEGORIES.length;
        saveRun();
        render();
        showToast('A viable genome was generated.');
      }

      function beginTrials() {
        if (completedCategories() < CATEGORIES.length || spentBudget() > BIO_BUDGET) return;
        if (!savedRun.speciesName.trim()) savedRun.speciesName = generateName();
        savedRun.worlds = shuffle(ENVIRONMENTS).slice(0, 3).map(env => ({
          envId: env.id,
          situationIds: env.situations.map(situation => situation.id)
        }));
        savedRun.phase = 'cer';
        savedRun.worldIndex = 0;
        savedRun.situationIndex = 0;
        savedRun.currentClaim = null;
        savedRun.selectedEvidence = [];
        savedRun.selectedReasoning = null;
        savedRun.scenarioResults = [];
        savedRun.worldReports = [];
        savedRun.stats = {population:72, energy:72, resources:55};
        savedRun.completed = false;
        savedRun.sceneTransition = true;
        saveRun();
        setView('trial');
      }

      function getCurrentExpedition() {
        const worldRef = savedRun?.worlds?.[savedRun.worldIndex];
        const env = ENVIRONMENTS.find(item => item.id === worldRef?.envId);
        const situationId = worldRef?.situationIds?.[savedRun.situationIndex];
        const situation = env?.situations.find(item => item.id === situationId) || env?.situations?.[savedRun.situationIndex];
        return {worldRef, env, situation};
      }

      function getSituationByResult(result) {
        const env = ENVIRONMENTS.find(item => item.id === result?.envId);
        const situation = env?.situations.find(item => item.id === result?.situationId);
        const claim = situation?.claims.find(item => item.id === result?.claimId);
        return {env, situation, claim};
      }

      function mergedScenarioPressures(env, situation) {
        const merged = {...(situation?.pressures || {})};
        Object.entries(env?.challenges || {}).forEach(([tag, severity]) => {
          merged[tag] = (merged[tag] || 0) + severity * .35;
        });
        return merged;
      }

      function renderWorldProgress() {
        return `<div class="trial-progress">${[0,1,2].map(index => {
          const ref = savedRun.worlds[index];
          const env = ENVIRONMENTS.find(item => item.id === ref?.envId);
          const report = savedRun.worldReports.find(item => item.worldIndex === index);
          const completedInWorld = savedRun.scenarioResults.filter(item => item.worldIndex === index).length;
          const done = Boolean(report) || index < savedRun.worldIndex;
          const active = index === savedRun.worldIndex && currentView !== 'final';
          const visibleProgress = completedInWorld + (active && currentView === 'trial' ? 1 : 0);
          return `<div class="trial-node ${done ? 'done' : ''} ${active ? 'active' : ''}">
            <strong>${done ? '✓ ' : ''}World ${index + 1}</strong>
            <span>${env ? `${escapeHTML(env.code)} • ${done ? '3/3' : `${Math.min(visibleProgress, 3)}/3`}` : 'Unknown'}</span>
          </div>`;
        }).join('')}</div>`;
      }

      function currentCERStage() {
        if (!savedRun.currentClaim) return 'claim';
        if ((savedRun.selectedEvidence || []).length < 2) return 'evidence';
        if (!savedRun.selectedReasoning) return 'reasoning';
        return 'ready';
      }

      function renderCERSteps() {
        const stage = currentCERStage();
        const order = ['claim','evidence','reasoning'];
        const activeIndex = stage === 'ready' ? 2 : order.indexOf(stage);
        return `<div class="cer-steps">${order.map((item,index) => {
          const done = item === 'claim' ? Boolean(savedRun.currentClaim) : item === 'evidence' ? (savedRun.selectedEvidence || []).length === 2 : Boolean(savedRun.selectedReasoning);
          const active = stage === 'ready' ? item === 'reasoning' : index === activeIndex;
          return `<div class="cer-step ${done ? 'done' : ''} ${active ? 'active' : ''}"><b>${done ? '✓' : index + 1}</b><span>${item}</span></div>`;
        }).join('')}</div>`;

      function buildEvidencePool(situation, claim) {
        const fieldEvidence = (situation?.evidence || []).map(item => ({...item, source:'Field observation'}));
        if (!claim) return fieldEvidence;
        const options = selectedOptions();
        const positive = options.filter(option => (claim.boost || []).includes(option.id)).slice(0,2);
        const negative = options.filter(option => (claim.penalty || []).includes(option.id)).slice(0,1);
        const dynamic = [];
        positive.forEach(option => dynamic.push({
          id:`genome-plus-${option.id}`,
          text:`Genome scan: ${option.name}. ${option.desc}`,
          supports:[claim.id], contradicts:[], source:'Genome evidence'
        }));
        negative.forEach(option => dynamic.push({
          id:`genome-risk-${option.id}`,
          text:`Genome risk: ${option.name}. ${option.desc}`,
          supports:[], contradicts:[claim.id], source:'Genome evidence'
        }));
        if (!dynamic.length && options.length) {
          const option = options[0];
          dynamic.push({
            id:`genome-neutral-${option.id}`,
            text:`Genome scan: ${option.name}. ${option.desc}`,
            supports:[], contradicts:[], source:'Genome evidence'
          });
        }
        return [...fieldEvidence, ...dynamic].slice(0,8);

      function hashString(value) {
        let hash = 2166136261;
        for (const char of String(value)) {
          hash ^= char.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function stableShuffle(array, seedText) {
        const copy = [...array];
        let seed = hashString(seedText) || 1;
        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function getReasoningOptions(situation, claim) {
        if (!claim) return [];
        const partials = [
          `The habitat contains several risks, so ${claim.short.toLowerCase()} may help the population survive.`,
          `One field observation is related to ${claim.short.toLowerCase()}, and living things often adjust when conditions change.`,
          `${claim.short} could reduce one immediate problem, although this explanation does not connect both pieces of evidence to the creature’s biology.`
        ];
        const weak = [
          `${claim.short} is the best claim because it is the option I selected.`,
          `This choice should work because it sounds safer than the other choices.`,
          `The population will survive if it tries hard enough, so this claim must be correct.`
        ];
        const seed = `${situation.id}-${claim.id}-${savedRun.speciesName}`;
        const partial = partials[hashString(seed) % partials.length];
        const circular = weak[hashString(`${seed}-weak`) % weak.length];
        return stableShuffle([
          {id:'causal', quality:100, text:`The evidence supports this claim because ${claim.reasoning}`},
          {id:'partial', quality:58, text:partial},
          {id:'circular', quality:22, text:circular}
        ], seed);
      }

        if (f.predator) overlays.push(`<g fill="#ff7777" filter="url(#${uid}glow)"><ellipse cx="32" cy="42" rx="7" ry="4"/><ellipse cx="50" cy="42" rx="7" ry="4"/></g>`);
        if (f.hazard) overlays.push(`<g fill="rgba(255,126,128,.58)" stroke="rgba(255,224,224,.35)" stroke-width="2">${[[43,37,6],[69,26,5],[119,35,7],[142,55,5],[104,18,4]].map(([x,y,r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>`);
        if (f.weather && !primary.join('').includes('M40 77')) overlays.push(`<g fill="none" stroke="rgba(235,255,252,.62)" stroke-width="4" stroke-linecap="round"><path d="M28 35h75"/><path d="M91 27l14 8-14 8"/><path d="M73 51h72"/><path d="M133 43l14 8-14 8"/></g>`);
        if (f.debris) overlays.push(`<g fill="#a8aeb2" stroke="#e1ecee" stroke-width="2"><path d="M29 111l13-27l18 27z"/><path d="M117 111l12-31l21 31z"/><path d="M79 115l9-22l14 22z"/></g>`);
        if (f.dark) overlays.push(`<path d="M145 18a17 17 0 1 0 13 26a20 20 0 0 1-13-26z" fill="#e7f4c7" opacity=".82"/>`);
        if (f.time) overlays.push(`<g transform="translate(22 18)"><circle cx="15" cy="15" r="13" fill="rgba(7,23,29,.82)" stroke="#f4dc8d" stroke-width="3"/><path d="M15 7v9l7 5" fill="none" stroke="#f4dc8d" stroke-width="3" stroke-linecap="round"/></g>`);
        if (f.distance) overlays.push(`<g transform="translate(139 61)"><path d="M0 47V0" stroke="#e9f7f3" stroke-width="4"/><path d="M0 4h25l-8 10l8 10H0" fill="${palette.accent}" opacity=".82"/></g>`);
        if (f.air) overlays.push(`<g fill="none" stroke="rgba(217,251,255,.72)" stroke-width="4" stroke-linecap="round"><path d="M45 29q15-12 30 0t30 0"/><path d="M64 42q13-9 26 0t26 0"/></g>`);
        if (f.heat) overlays.push(`<g fill="none" stroke="#ffbd68" stroke-width="4" stroke-linecap="round"><path d="M37 26q-8 10 0 20q8 10 0 20M55 20q-8 10 0 20q8 10 0 20"/></g>`);
        if (f.group) overlays.push(`<g fill="rgba(228,255,248,.7)"><circle cx="129" cy="82" r="5"/><circle cx="145" cy="87" r="5"/><circle cx="137" cy="69" r="5"/><path d="M120 105q9-20 18 0m-2 0q9-19 18 0m-25-11q8-20 16 0"/></g>`);
        if (f.exposed) overlays.push(`<g transform="translate(145 22)"><circle r="13" fill="#ffe49a"/><g stroke="#ffe49a" stroke-width="3">${[0,45,90,135].map(a => `<path d="M0-20V-28" transform="rotate(${a})"/>`).join('')}</g></g>`);

        const aria = compact ? '' : ` role="img" aria-label="${escapeHTML(text)}"`;

          <defs>
            <linearGradient id="${uid}ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${palette.mid}"/><stop offset="1" stop-color="${palette.shadow}"/></linearGradient>

        </svg>`;
      }

      function renderGenomeEvidenceIcon(item) {
        const risk = String(item?.id || '').includes('risk');
        const accent = risk ? '#ffb36b' : '#73f2cc';
        return `<svg viewBox="0 0 80 70" aria-hidden="true"><g fill="none" stroke="${accent}" stroke-width="4" stroke-linecap="round"><path d="M22 8c34 12 34 42 0 54M58 8c-34 12-34 42 0 54"/><path d="M27 17h26M22 29h36M22 42h36M27 54h26"/></g>${risk ? '<path d="M40 18l18 34H22z" fill="rgba(255,179,107,.18)" stroke="#ffb36b" stroke-width="3"/><path d="M40 30v11m0 7v1" stroke="#ffcf99" stroke-width="4" stroke-linecap="round"/>' : '<circle cx="40" cy="35" r="7" fill="rgba(115,242,204,.22)" stroke="#73f2cc" stroke-width="3"/>'}</svg>`;
      }

      function renderFieldEvidencePlane(env, situation, blueprint) {
        const positions = getFieldCluePositions(blueprint?.layout, situation?.id);
        const selected = savedRun?.selectedEvidence || [];
        return `<div class="field-evidence-plane" aria-label="Interactive field evidence">
          ${(situation?.evidence || []).map((item,index) => {
            const [x,y,z,scale,tilt] = positions[index] || positions[0];
            const isSelected = selected.includes(item.id);
            return `<button class="field-clue ${isSelected ? 'selected' : ''}" type="button" data-action="inspect-clue" data-clue-id="${escapeHTML(item.id)}" data-clue-label="F${index + 1}" data-clue-text="${escapeHTML(item.text)}" aria-label="Inspect field clue F${index + 1}: ${escapeHTML(item.text)}" style="--clue-x:${x}%;--clue-y:${y}%;--clue-z:${z}px;--clue-scale:${scale};--clue-tilt:${tilt}deg;--clue-delay:${(-index * .37).toFixed(2)}s">
              ${renderEvidenceDiorama(item,index,env.id)}<span class="field-clue-marker">F${index + 1}</span>
            </button>`;
          }).join('')}
        </div>`;
      }

      function renderFieldScanReadout(situation) {
        const selectedId = (savedRun?.selectedEvidence || []).find(id => (situation?.evidence || []).some(item => item.id === id));
        const selectedIndex = (situation?.evidence || []).findIndex(item => item.id === selectedId);
        const selectedItem = selectedIndex >= 0 ? situation.evidence[selectedIndex] : null;
        return `<div class="field-scan-readout ${selectedItem ? 'active' : ''}" aria-live="polite">
          <strong>${selectedItem ? `Selected field clue F${selectedIndex + 1}` : 'Field evidence scan'}</strong>
          <span class="${selectedItem ? '' : 'scan-help'}">${selectedItem ? escapeHTML(selectedItem.text) : 'Inspect the six illustrated objects labeled F1-F6. They are observations, not answer markers.'}</span>
        </div><div class="field-scan-legend">Click F1-F6 to inspect • Selected evidence glows</div>`;
      }


      function renderScenarioBackdrop(env, situation, claimId) {
        const blueprint = SCENE_BLUEPRINTS[situation?.id] || {motifs:['route','route','route'],layout:'fan',light:[72,18]};
        const palette = WORLD_SCENE_PALETTES[env.id] || WORLD_SCENE_PALETTES.canopy;
        return `<div class="scene-25d" aria-hidden="true">
          <div class="depth-layer depth-far">${renderWorldFarLayer(env.id,palette)}</div>
          <div class="depth-layer depth-mid">
            <div class="scene-depth-haze"></div>
            <div class="scenario-feature-wrap">${renderScenarioFeature(situation?.id)}</div>
            ${renderSceneRoutes(situation,claimId)}
            ${renderSceneLandmarks(situation,blueprint,claimId)}
            <div class="scene-lighting"></div>
          </div>
        </div>${renderFieldEvidencePlane(env,situation,blueprint)}`;
      }

      function renderScenarioForeground(env) {
        const palette = WORLD_SCENE_PALETTES[env.id] || WORLD_SCENE_PALETTES.canopy;
        return `<div class="scene-near-25d" aria-hidden="true"><div class="depth-layer depth-near">${renderWorldNearLayer(env.id,palette)}</div></div>`;
      }

      function getLandmarkPositions(layout) {
        if (layout === 'terraces') return [[21,42,14],[50,27,-2],[79,43,20]];
        if (layout === 'horizon') return [[21,34,2],[50,29,12],[79,35,4]];
        return [[21,39,12],[50,30,-2],[79,40,18]];
      }

      function renderSceneLandmarks(situation, blueprint, claimId) {
        const positions = getLandmarkPositions(blueprint.layout);
        return situation.claims.map((claim,index) => {
          const selected = claim.id === claimId;
          const dimmed = claimId && !selected;
          const [x,y,z] = positions[index] || positions[1];
          const motif = blueprint.motifs[index] || 'route';
          return `<div class="decision-landmark ${selected ? 'selected' : ''} ${dimmed ? 'dimmed' : ''}" style="--landmark-x:${x}%;--landmark-y:${y}%;--landmark-z:${z}px">
            <div class="landmark-art">${renderLandmarkIcon(motif)}</div>
            <div class="landmark-copy"><strong>${escapeHTML(claim.short)}</strong><span>${escapeHTML(claim.risk)} path</span></div>
          </div>`;
        }).join('');
      }

      function renderSceneRoutes(situation, claimId) {
        const paths = [
          'M500 598 C430 520 300 500 210 315',
          'M500 598 C505 500 500 425 500 255',
          'M500 598 C575 520 700 500 790 320'
        ];
        return `<svg class="scene-routes" viewBox="0 0 1000 600" preserveAspectRatio="none">${situation.claims.map((claim,index) => `<path class="route-path ${claim.id === claimId ? 'selected' : ''}" d="${paths[index]}"/>`).join('')}</svg>`;
      }

      function renderWeather(type) {
        if (!type || type === 'none') return '';
        const count = type === 'rain' ? 32 : type === 'smog' ? 14 : type === 'spores' ? 26 : 24;
        return Array.from({length:count}, (_, index) => {
          const left = (index * 37 + 11) % 100;
          const delay = -((index * .17) % 3.1);
          const duration = type === 'smog' ? 5 + ((index * 7) % 23) / 10 : 1.4 + ((index * 13) % 17) / 10;
          return `<span class="particle ${type}" style="left:${left}%;animation-delay:${delay}s;animation-duration:${duration}s"></span>`;
        }).join('');
      }

      function evaluateCERDecision(env, situation, claim) {
        const evidencePool = buildEvidencePool(situation, claim);
        const selectedCards = (savedRun.selectedEvidence || []).map(id => evidencePool.find(item => item.id === id)).filter(Boolean);
        let supportCount = 0;
        let contradictionCount = 0;
        let neutralCount = 0;
        selectedCards.forEach(card => {
          if ((card.supports || []).includes(claim.id)) supportCount++;
          else if ((card.contradicts || []).includes(claim.id)) contradictionCount++;
          else neutralCount++;
        });
        const evidenceScore = clamp(10 + supportCount * 45 + neutralCount * 5 - contradictionCount * 25, 0, 100);
        const reasoningOptions = getReasoningOptions(situation, claim);
        const reasoning = reasoningOptions.find(item => item.id === savedRun.selectedReasoning) || reasoningOptions[0];
        const reasoningScore = reasoning?.quality || 0;
        const cerScore = Math.round(evidenceScore * .55 + reasoningScore * .45);

        const selected = selectedOptions();
        const selectedIds = new Set(selected.map(option => option.id));
        const boosted = (claim.boost || []).filter(id => selectedIds.has(id));
        const penalized = (claim.penalty || []).filter(id => selectedIds.has(id));
        const pressures = mergedScenarioPressures(env, situation);
        const traitContributions = selected.map(option => {
          let value = 0;
          Object.entries(pressures).forEach(([tag,severity]) => { value += (option.effects[tag] || 0) * severity * .35; });
          if (boosted.includes(option.id)) value += 4;
          if (penalized.includes(option.id)) value -= 5;
          return {label:option.name, value:Math.round(value)};
        }).filter(item => Math.abs(item.value) >= 2).sort((a,b) => Math.abs(b.value) - Math.abs(a.value));
        const pressureFit = clamp(Math.round(traitContributions.reduce((sum,item) => sum + item.value, 0) * .38), -18, 18);
        const actionFit = boosted.length * 4 - penalized.length * 5;
        const reserve = Math.max(0, BIO_BUDGET - spentBudget());
        const reserveBonus = Math.round(reserve * .7);
        const statAverage = (savedRun.stats.population + savedRun.stats.energy + savedRun.stats.resources) / 3;
        const stateModifier = clamp(Math.round((statAverage - 62) * .08), -5, 4);
        const riskModifier = claim.risk === 'Controlled' ? 2 : claim.risk === 'Bold' ? -1 : 0;
        let score = 55 + pressureFit + actionFit + reserveBonus + stateModifier + riskModifier + Math.round((cerScore - 58) * .22);
        score = clamp(Math.round(score), 8, 98);

        const changes = {
          population: claim.effect.population || 0,
          energy: claim.effect.energy || 0,
          resources: claim.effect.resources || 0
        };
        if (score >= 85) { changes.population += 5; changes.energy += 4; changes.resources += 4; }
        else if (score >= 72) { changes.population += 2; changes.energy += 2; changes.resources += 2; }
        else if (score >= 58) { changes.population += 0; changes.energy += 0; changes.resources += 0; }
        else if (score >= 43) { changes.population -= 4; changes.energy -= 3; changes.resources -= 2; }
        else { changes.population -= 8; changes.energy -= 6; changes.resources -= 4; }

        const statsBefore = {...savedRun.stats};
        const statsAfter = {
          population: clamp(statsBefore.population + changes.population, 5, 100),
          energy: clamp(statsBefore.energy + changes.energy, 5, 100),
          resources: clamp(statsBefore.resources + changes.resources, 5, 100)
        };
        changes.population = statsAfter.population - statsBefore.population;
        changes.energy = statsAfter.energy - statsBefore.energy;
        changes.resources = statsAfter.resources - statsBefore.resources;

        let status, tierText;
        if (score >= 86) { status='Thrived'; tierText='The decision, genome, and CER worked together exceptionally well.'; }
        else if (score >= 72) { status='Adapted'; tierText='The population converted the choice into a clear survival advantage.'; }
        else if (score >= 58) { status='Endured'; tierText='The plan worked, but important biological costs remained.'; }
        else if (score >= 43) { status='Costly Survival'; tierText='The expedition continued after meaningful losses and resource stress.'; }
        else { status='Severe Setback'; tierText='The population survived, but the mismatch created major consequences.'; }

              : 'The selected observations do not directly support this claim.';

          ? 'The reasoning explains a cause-and-effect link between the evidence, the claim, and the creature’s biology.'
          : reasoningScore >= 50
            ? 'The reasoning is related to the claim, but the causal link is incomplete.'
            : 'The reasoning is circular or based on preference rather than biological evidence.';

        return {
          worldIndex:savedRun.worldIndex,
          situationIndex:savedRun.situationIndex,
          envId:env.id,
          situationId:situation.id,
          claimId:claim.id,
          claimText:claim.text,
          branchScene:claim.scene,
          score,
          status,
          outcome:`${claim.outcome} ${tierText}`,
          continuation:claim.continuation,
          statsBefore,
          statsAfter,

    .name-field { margin-top: 16px; }

    .trial-shell { display: grid; gap: 18px; }

    .trial-progress {

    .trial-node {
      position: relative;

    .trial-node.done { color: #bcefc8; border-color: rgba(118,243,155,0.25); }

    .trial-layout {

    .result-trial-layout {

    .habitat-scene {
      min-height: 535px;
      height: clamp(535px, calc(100vh - var(--topbar) - 150px), 650px);
      position: sticky;
      top: calc(var(--topbar) + 18px);
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .habitat-scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.35));

    .scene-sky, .scene-ground, .scene-decor, .weather-layer, .field-creature { position: absolute; }
    .scene-sky { inset: 0; z-index: 0; }
    .scene-ground { left: -5%; right: -5%; bottom: -8%; height: 37%; z-index: 2; }
    .scene-decor { inset: 0; z-index: 3; pointer-events: none; }
    .weather-layer { inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }

    .field-creature {
      width: min(48%, 500px);

    .habitat-scene.sim-running .field-creature { animation: trialMove 2.45s ease-in-out both; }
    @keyframes trialMove {
      0% { transform: translateX(-14%) scale(0.96); }
      35% { transform: translateX(8%) scale(1.02) rotate(-1deg); }
      70% { transform: translateX(-3%) scale(0.98) rotate(1deg); }
      100% { transform: translateX(10%) scale(1); }

    .scene-desert .scene-sky { background: linear-gradient(#ffb05d, #d96245 55%, #8f3d3a); }
    .scene-desert .scene-sky::before { content:""; position:absolute; width:110px; height:110px; border-radius:50%; right:10%; top:10%; background:#ffe69b; box-shadow:0 0 45px #ffd17b; }
    .scene-desert .scene-ground { background: radial-gradient(ellipse at 30% 20%, #efad5c 0 32%, transparent 33%), radial-gradient(ellipse at 70% 18%, #d98647 0 38%, transparent 39%), linear-gradient(#cf7044,#8d3f37); border-radius: 50% 50% 0 0; }

    .scene-polar .scene-sky { background: linear-gradient(#8ec9e5, #bfdce7 58%, #89a9ba); }
    .scene-polar .scene-ground { background: linear-gradient(170deg, #e8fbff 0 42%, #9fc7da 43% 60%, #f1feff 61%); clip-path: polygon(0 38%, 17% 21%, 35% 43%, 56% 12%, 75% 40%, 100% 21%, 100% 100%, 0 100%); }

    .scene-mangrove .scene-sky { background: linear-gradient(#3d8f91, #235f67 54%, #163d4c); }
    .scene-mangrove .scene-ground { background: linear-gradient(rgba(64,175,169,0.75), #164956); height: 30%; box-shadow: inset 0 15px 22px rgba(168,255,227,0.12); }

    .scene-canopy .scene-sky { background: linear-gradient(#58a96e, #1c684f 52%, #11443c); }
    .scene-canopy .scene-ground { background: linear-gradient(#315a38,#0e2d29); clip-path: polygon(0 35%, 18% 24%, 35% 42%, 57% 18%, 74% 39%, 100% 22%, 100% 100%, 0 100%); }

    .scene-caldera .scene-sky { background: linear-gradient(#692e2e, #241c23 55%, #100f15); }
    .scene-caldera .scene-ground { background: linear-gradient(170deg, #282329 0 44%, #fb6b35 45% 49%, #19161b 50% 70%, #ff8c42 71% 74%, #151319 75%); clip-path: polygon(0 25%, 17% 12%, 31% 31%, 48% 7%, 66% 26%, 82% 10%, 100% 27%, 100% 100%, 0 100%); }

    .scene-metro .scene-sky { background: linear-gradient(#584578, #25284f 55%, #10182c); }
    .scene-metro .scene-ground { background: linear-gradient(#343541,#11151f); height: 28%; }

    .scene-highlands .scene-sky { background: linear-gradient(#70a4b8, #637b8f 55%, #394a5a); }
    .scene-highlands .scene-ground { background: linear-gradient(165deg,#a6bbc0,#4b6671 48%,#263f4d 49%); clip-path: polygon(0 42%, 16% 13%, 31% 38%, 52% 4%, 70% 40%, 87% 16%, 100% 36%, 100% 100%, 0 100%); }

    .tree-trunk { position:absolute; bottom:22%; width:35px; height:62%; background:linear-gradient(90deg,#173c30,#385b3a,#123126); border-radius:45% 35% 10% 10%; }
    .tree-trunk::before { content:""; position:absolute; width:170px; height:100px; border-radius:50%; background:rgba(39,113,61,0.86); left:-68px; top:-30px; box-shadow:60px 25px 0 rgba(27,91,57,0.75), -45px 25px 0 rgba(38,124,68,0.7); }
    .mangrove-root { position:absolute; bottom:18%; width:18px; height:250px; background:#302e27; transform:rotate(22deg); border-radius:50%; transform-origin:bottom; }
    .building { position:absolute; bottom:27%; width:100px; background:linear-gradient(#343a5a,#1b2239); border:1px solid rgba(255,255,255,0.08); box-shadow:inset 0 0 0 6px rgba(0,0,0,0.12); }
    .building::after { content:""; position:absolute; inset:15px; background:repeating-linear-gradient(90deg, rgba(255,220,130,0.5) 0 7px, transparent 8px 19px), repeating-linear-gradient(0deg, rgba(255,220,130,0.45) 0 6px, transparent 7px 20px); opacity:.5; }
    .stalactite { position:absolute; top:-1px; width:52px; height:150px; background:linear-gradient(#17262c,#293c42); clip-path:polygon(0 0,100% 0,56% 100%); }
    .ash-spire { position:absolute; bottom:23%; width:80px; height:190px; background:#211c22; clip-path:polygon(50% 0,100% 100%,0 100%); }

    .particle { position:absolute; top:-12%; width:5px; height:5px; border-radius:50%; opacity:.75; animation:fall linear infinite; }
    @keyframes fall { to { transform:translateY(720px) translateX(35px) rotate(180deg); } }
    .rain { width:2px; height:24px; border-radius:2px; background:rgba(190,255,249,0.55); }
    .snow { background:#fff; box-shadow:0 0 8px rgba(255,255,255,.7); }
    .ash { background:#42343a; }
    .dust { background:#ffc181; }

    .scene-info {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;

      gap: 16px;
      pointer-events: none;

      background: rgba(4, 16, 20, 0.56);

      backdrop-filter: blur(10px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }

    .scene-label span { display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; opacity:.75; }

    .simulation-overlay {

      background: rgba(3, 13, 17, 0.54);

      width: min(430px, 92%);
      padding: 24px;

      border: 1px solid rgba(97,242,204,0.34);

    .trial-panel { padding: 23px; display: flex; flex-direction: column; min-height: 535px; }
    .trial-panel h2 { margin-bottom: 9px; }
    .event-card { margin: 6px 0 14px; padding: 12px 13px; border-left: 3px solid var(--warning); border-radius: 0 12px 12px 0; background: rgba(255,209,102,0.07); }

    .event-card span { color: var(--muted); font-size: .82rem; line-height:1.45; }

    .challenge-row { display:flex; flex-wrap:wrap; gap:7px; margin: 5px 0 16px; }
    .challenge-chip { padding: 6px 9px; border-radius:999px; background:rgba(255,255,255,.045); border:1px solid var(--line); color:#c9dddd; font-size:.72rem; }
    .challenge-chip b { color:var(--warning); letter-spacing:.08em; }

    .population-box { margin-bottom: 16px; padding: 11px 12px; border:1px solid var(--line); border-radius:13px; background:rgba(0,0,0,.13); }
    .population-head { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.76rem; }
    .population-head strong { color:var(--text); }
    .population-bar { height:9px; margin-top:9px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.07); }
    .population-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,#57cfce,#9efa78); transition:width .35s ease; }

    .action-label { margin-bottom:9px; color:var(--muted); font-size:.75rem; font-weight:850; text-transform:uppercase; letter-spacing:.1em; }
    .action-list { display:grid; gap:9px; }
    .action-card { padding:13px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.025); cursor:pointer; text-align:left; transition:150ms ease; }
    .action-card:hover { border-color:var(--line-strong); background:rgba(255,255,255,.05); }
    .action-card.selected { border-color:rgba(97,242,204,.6); background:rgba(97,242,204,.09); }
    .action-card strong { display:flex; justify-content:space-between; gap:12px; }
    .action-card strong span { color:var(--accent); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
    .action-card p { margin:6px 0 0; color:var(--muted); font-size:.79rem; line-height:1.4; }
    .trial-cta { margin-top:auto; padding-top:16px; }
    .trial-cta .primary-btn { width:100%; }

    .result-card { padding: 22px; }
    .result-layout { display:grid; grid-template-columns:minmax(230px,.65fr) minmax(0,1.35fr); gap:24px; align-items:center; }
    .score-gauge { width:210px; aspect-ratio:1; margin:0 auto; display:grid; place-items:center; border-radius:50%; position:relative; background:conic-gradient(var(--accent) calc(var(--score) * 1%), rgba(255,255,255,.065) 0); }
    .score-gauge::before { content:""; position:absolute; inset:14px; border-radius:50%; background:#0a2028; box-shadow:inset 0 0 28px rgba(0,0,0,.28); }
    .score-gauge-inner { position:relative; z-index:1; text-align:center; }
    .score-gauge strong { display:block; font-size:3.3rem; line-height:1; letter-spacing:-.06em; }
    .score-gauge span { color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.12em; }
    .result-title { margin-bottom:8px; }
    .result-sub { color:var(--muted); line-height:1.55; }

    .factor-columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:17px; }
    .factor-box { padding:13px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.025); }
    .factor-box h3 { margin-bottom:9px; font-size:.82rem; text-transform:uppercase; letter-spacing:.09em; }
    .factor-list { display:grid; gap:7px; }
    .factor-item { display:flex; justify-content:space-between; gap:12px; font-size:.78rem; }
    .factor-item span:first-child { color:var(--muted); }
    .positive { color:var(--good); }
    .negative { color:var(--danger); }
    .neutral { color:var(--warning); }
    .result-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }

    .final-shell { display:grid; gap:18px; }
    .final-hero { padding: clamp(24px,3vw,42px); display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,.58fr); gap:30px; align-items:center; }
    .final-scoreline { display:flex; align-items:flex-end; gap:14px; margin:15px 0; }
    .final-scoreline strong { font-size:clamp(4rem,9vw,7rem); line-height:.78; letter-spacing:-.08em; color:var(--accent); }
    .final-scoreline span { color:var(--muted); padding-bottom:5px; }
    .final-hero p { color:var(--muted); line-height:1.6; max-width:720px; }
    .classification { display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid rgba(166,255,117,.25); border-radius:999px; color:#c8ffa9; background:rgba(166,255,117,.07); font-weight:850; font-size:.78rem; }
    .final-creature { min-height:340px; display:grid; place-items:center; border:1px solid var(--line); border-radius:20px; background:radial-gradient(circle,rgba(97,242,204,.12),transparent 60%); }
    .final-creature .creature-svg { width:95%; }

    .world-results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .world-card { padding:17px; border:1px solid var(--line); border-radius:17px; background:rgba(255,255,255,.025); }
    .world-card-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .world-card h3 { margin:0; }
    .world-score { font-size:1.75rem; font-weight:950; color:var(--accent); }
    .world-card p { margin:8px 0 0; color:var(--muted); font-size:.82rem; line-height:1.45; }
    .mini-bar { height:7px; margin-top:13px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.07); }
    .mini-bar span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
    .final-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:5px 0 8px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 20px;
      display: grid;
      place-items: center;
      background: rgba(1, 8, 11, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(620px, 100%);
      max-height: min(760px, 92vh);
      overflow:auto;
      padding: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      background: #0b222b;

    .modal-head h2 { font-size:1.7rem; }
    .close-btn { width:38px; height:38px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.035); cursor:pointer; }
    .how-grid { display:grid; gap:10px; margin-top:16px; }
    .how-step { display:grid; grid-template-columns:36px 1fr; gap:12px; padding:12px; border-radius:13px; background:rgba(255,255,255,.025); border:1px solid var(--line); }

    .how-step strong { display:block; margin-bottom:4px; }
    .how-step span { color:var(--muted); font-size:.84rem; line-height:1.45; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;

      transform: translate(-50%, 18px);
      padding: 10px 14px;
      border: 1px solid var(--line-strong);

      color: var(--text);
      background: rgba(8, 29, 36, 0.95);

      pointer-events: none;

      font-size: .82rem;

    .sr-only { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; white-space:nowrap !important; border:0 !important; }

      line-height:1.45;
    }
    .continuity-card b { color:var(--accent); flex:0 0 auto; }

    .scene-stage-low .field-creature, .branch-low .field-creature { bottom:6%; left:13%; width:min(46%,480px); transform:scale(.92); }
    .branch-water .scene-ground::after { content:''; position:absolute; left:0; right:0; top:-15%; height:50%; background:linear-gradient(rgba(98,228,229,.24),rgba(18,85,105,.5)); box-shadow:inset 0 10px 25px rgba(195,255,246,.1); }
    .branch-water .field-creature { bottom:4%; animation:floatCreature 2.4s ease-in-out infinite alternate; }
    .branch-shelter::after { background:radial-gradient(circle at 50% 65%,transparent 10%,rgba(0,0,0,.7) 76%); }
    .branch-feed .field-creature { transform:translateY(8px) scale(.97) rotate(1deg); }
    .branch-hunt .field-creature { left:42%; transform:rotate(-3deg) scale(.94); }

    .branch-move .field-creature { animation:fieldTravel 1.9s ease-in-out infinite alternate; }
    .branch-hazard .field-creature { filter:drop-shadow(0 20px 14px rgba(0,0,0,.42)) saturate(.78); }
    .scene-outcome-good { box-shadow:var(--shadow), inset 0 0 0 2px rgba(118,243,155,.2); }
    .scene-outcome-bad { box-shadow:var(--shadow), inset 0 0 0 2px rgba(255,118,118,.18); }
    .habitat-scene.scene-enter { animation:sceneEnter .72s cubic-bezier(.2,.75,.2,1) both; }
    @keyframes sceneEnter { from { opacity:.15; transform:scale(1.025); filter:blur(8px); } to { opacity:1; transform:scale(1); filter:blur(0); } }
    @keyframes fieldTravel { from { transform:translateX(-5%) rotate(-1deg); } to { transform:translateX(7%) rotate(1deg); } }
    @keyframes floatCreature { from { transform:translateY(0) rotate(-1deg); } to { transform:translateY(-12px) rotate(1deg); } }
    .spores { width:9px; height:9px; background:rgba(180,255,175,.5); box-shadow:0 0 12px rgba(164,255,153,.35); animation-name:driftFall; }
    .sparks { width:3px; height:14px; border-radius:2px; background:#ffe56f; box-shadow:0 0 8px rgba(255,212,70,.75); animation-name:sparkFall; }
    .smog { width:70px; height:28px; border-radius:50%; background:rgba(157,255,200,.12); filter:blur(9px); animation-name:smogDrift; }
    @keyframes driftFall { to { transform:translateY(650px) translateX(70px) rotate(240deg); opacity:.1; } }
    @keyframes sparkFall { to { transform:translateY(640px) translateX(-40px) rotate(440deg); opacity:0; } }
    @keyframes smogDrift { to { transform:translateY(540px) translateX(150px) scale(1.5); opacity:.03; } }
    .transition-overlay {
      position:absolute; inset:0; z-index:30; display:grid; place-items:center; padding:24px;

    .world-report-shell { display:grid; gap:18px; }

    @media (max-width: 1180px) {

    .habitat-scene.scene-25d-ready {
      --focus-far: 0px;
      --focus-mid: 0px;
      --focus-near: 0px;
      --parallax-far-x: 0px;
      --parallax-far-y: 0px;
      --parallax-mid-x: 0px;
      --parallax-mid-y: 0px;
      --parallax-near-x: 0px;
      --parallax-near-y: 0px;
      --creature-left: 32.5%;
      --creature-start-left: 32.5%;
      --creature-bottom: 7%;
      --creature-scale: .94;
      perspective: 1100px;
      transform-style: preserve-3d;
      background: #07151b;
    }
    .habitat-scene.scene-choice-0 {
      --focus-far: 7px; --focus-mid: 14px; --focus-near: 24px;
      --creature-left: 4%;
    }
    .habitat-scene.scene-choice-1 {
      --focus-far: 0px; --focus-mid: 0px; --focus-near: 0px;
      --creature-left: 32.5%;
    }
    .habitat-scene.scene-choice-2 {
      --focus-far: -7px; --focus-mid: -14px; --focus-near: -24px;
      --creature-left: 61%;
    }
    .habitat-scene.branch-high { --creature-bottom: 20%; --creature-scale: .84; }
    .habitat-scene.branch-low { --creature-bottom: 3%; --creature-scale: .91; }
    .habitat-scene.branch-water { --creature-bottom: 1%; --creature-scale: .88; }
    .habitat-scene.branch-shelter { --creature-bottom: 6%; --creature-scale: .9; }
    .habitat-scene.branch-feed { --creature-bottom: 6%; --creature-scale: .95; }
    .habitat-scene.branch-hunt { --creature-bottom: 8%; --creature-scale: .9; }
    .habitat-scene.branch-defend { --creature-bottom: 7%; --creature-scale: 1.01; }
    .habitat-scene.branch-hazard { --creature-bottom: 6%; --creature-scale: .9; }
    .habitat-scene.branch-open { --creature-bottom: 6%; --creature-scale: .9; }
    .habitat-scene.branch-move { --creature-bottom: 7%; --creature-scale: .9; }

    .scene-25d, .scene-near-25d {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      overflow: hidden;
    }
    .scene-25d { z-index: 4; }
    .scene-near-25d { z-index: 9; }
    .depth-layer {
      position: absolute;
      inset: -6%;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform .78s cubic-bezier(.2,.72,.2,1), filter .6s ease;
    }
    .depth-layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .depth-far {
      transform: translate3d(calc(var(--focus-far) + var(--parallax-far-x)), var(--parallax-far-y), -135px) scale(1.17);
      opacity: .94;
    }
    .depth-mid {
      transform: translate3d(calc(var(--focus-mid) + var(--parallax-mid-x)), var(--parallax-mid-y), -28px) scale(1.07);
    }
    .depth-near {
      transform: translate3d(calc(var(--focus-near) + var(--parallax-near-x)), var(--parallax-near-y), 85px) scale(1.045);
      filter: drop-shadow(0 22px 20px rgba(0,0,0,.3));
    }
    .world-far-art { opacity: .92; }
    .scenario-feature-wrap { position: absolute; inset: 0; z-index: 1; color: var(--scene-accent); }
    .scenario-feature { width: 100%; height: 100%; filter: drop-shadow(0 14px 20px rgba(0,0,0,.24)); }
    .scene-depth-haze {
      position: absolute; left: -5%; right: -5%; bottom: 14%; height: 34%; z-index: 2;
      background: linear-gradient(180deg, transparent, var(--scene-haze));
      filter: blur(11px); opacity: .58;

    .scene-lighting {
      position: absolute; inset: 0; z-index: 5;
      background:
        radial-gradient(circle at var(--light-x,72%) var(--light-y,18%), var(--scene-glow), transparent 32%),
        linear-gradient(180deg, rgba(255,255,255,.03), transparent 42%, rgba(0,0,0,.17));
      mix-blend-mode: screen; opacity: .8;

    .scene-routes {
      position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; overflow: visible;
      filter: drop-shadow(0 0 7px rgba(0,0,0,.42));
