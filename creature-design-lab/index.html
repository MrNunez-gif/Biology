    .route-path {
      fill: none; stroke: rgba(221,255,246,.34); stroke-width: 5;
      stroke-linecap: round; stroke-dasharray: 11 13; opacity: .26;
      transition: opacity .35s ease, stroke .35s ease, stroke-width .35s ease;
    }
    .route-path.selected {
      stroke: var(--scene-accent); stroke-width: 8; opacity: .94;
      animation: routeFlow 1.25s linear infinite;
    }
    @keyframes routeFlow { to { stroke-dashoffset: -48; } }

    .decision-landmark {
      --landmark-scale: .92;
      position: absolute; left: var(--landmark-x); top: var(--landmark-y); z-index: 4;
      width: clamp(118px, 21%, 164px);
      transform: translate(-50%,-50%) translateZ(var(--landmark-z)) rotateX(-4deg) scale(var(--landmark-scale));
      transform-origin: 50% 100%; opacity: .76;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .35s ease, filter .35s ease;
      filter: saturate(.78) brightness(.84);
    }
    .decision-landmark.selected {
      --landmark-scale: 1.08; opacity: 1;
      filter: saturate(1.15) brightness(1.08) drop-shadow(0 13px 20px rgba(0,0,0,.38));
      animation: landmarkArrival .65s cubic-bezier(.2,.8,.2,1) both;
    }
    .decision-landmark.dimmed { opacity: .46; }
    @keyframes landmarkArrival {
      from { transform: translate(-50%,-44%) translateZ(var(--landmark-z)) rotateX(-8deg) scale(.84); }
      to { transform: translate(-50%,-50%) translateZ(var(--landmark-z)) rotateX(-4deg) scale(1.08); }
    }
    .landmark-art {
      height: 92px; display: grid; place-items: center; overflow: hidden;
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 50% 50% 18px 18px / 58% 58% 18px 18px;
      color: rgba(229,255,247,.8);
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.15), transparent 36%),
        linear-gradient(155deg, rgba(11,31,37,.52), rgba(3,13,18,.84));
      backdrop-filter: blur(5px);
      box-shadow: inset 0 0 30px rgba(255,255,255,.04), 0 18px 35px rgba(0,0,0,.26);
    }
    .decision-landmark.selected .landmark-art {
      color: var(--scene-accent); border-color: var(--scene-accent);
      box-shadow: inset 0 0 34px var(--scene-glow), 0 0 0 3px rgba(255,255,255,.05), 0 18px 35px rgba(0,0,0,.38);
    }
    .landmark-art svg { width: 90%; height: 88%; }
    .landmark-copy {
      margin: -7px 7px 0; padding: 9px 9px 10px; position: relative; text-align: center;
      border: 1px solid rgba(255,255,255,.14); border-radius: 10px;
      background: rgba(4,15,20,.86); backdrop-filter: blur(8px);
      box-shadow: 0 10px 22px rgba(0,0,0,.3);
    }
    .landmark-copy strong { display: block; color: #f1fffc; font-size: 14px; line-height: 1.2; }
    .landmark-copy span { display: block; margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 1.15; }
    .decision-landmark.selected .landmark-copy { border-color: rgba(97,242,204,.48); }
    .decision-landmark.selected .landmark-copy span { color: var(--scene-accent); }

    .habitat-scene.scene-25d-ready > .scene-decor { opacity: .16; filter: blur(.4px); }
    .habitat-scene.scene-25d-ready > .scene-ground { transform: scale(1.08); transform-origin: 50% 100%; }
    .habitat-scene.scene-25d-ready .weather-layer { z-index: 7; }
    .habitat-scene.scene-25d-ready .field-creature {
      left: var(--creature-left) !important;
      bottom: var(--creature-bottom) !important;
      width: min(35%, 365px) !important;
      z-index: 8;
      animation: none !important;
      transform: scale(var(--creature-scale)) !important;
      transition: left .72s cubic-bezier(.2,.8,.2,1), bottom .72s cubic-bezier(.2,.8,.2,1), transform .72s cubic-bezier(.2,.8,.2,1), filter .4s ease;
      filter: drop-shadow(0 22px 16px rgba(0,0,0,.52));
    }
    .scene-claim-shift .field-creature {
      animation: claimRouteShift .72s cubic-bezier(.2,.8,.2,1) both !important;
    }
    @keyframes claimRouteShift {
      from { left: var(--creature-start-left); transform: translateY(6px) scale(calc(var(--creature-scale) * .92)); filter: drop-shadow(0 10px 8px rgba(0,0,0,.32)) brightness(.84); }
      to { left: var(--creature-left); transform: translateY(0) scale(var(--creature-scale)); filter: drop-shadow(0 22px 16px rgba(0,0,0,.52)) brightness(1); }
    }
    .creature-depth-wrap { width: 100%; transform-origin: 50% 100%; animation: creatureBreathe 3.1s ease-in-out infinite alternate; }
    .branch-move .creature-depth-wrap { animation: creatureTravel 1.75s ease-in-out infinite alternate; }
    .branch-water .creature-depth-wrap { animation: creatureSwim 2.15s ease-in-out infinite alternate; }
    .branch-hunt .creature-depth-wrap { animation: creatureHunt 1.6s ease-in-out infinite alternate; }
    .branch-defend .creature-depth-wrap { animation: creatureDefend 1.9s ease-in-out infinite alternate; }
    @keyframes creatureBreathe { from { transform: translateY(0) rotate(-.3deg); } to { transform: translateY(-7px) rotate(.5deg); } }
    @keyframes creatureTravel { from { transform: translateX(-5%) translateY(0) rotate(-1deg); } to { transform: translateX(6%) translateY(-5px) rotate(1deg); } }
    @keyframes creatureSwim { from { transform: translateY(2px) rotate(-1.5deg); } to { transform: translateY(-11px) rotate(1.5deg); } }
    @keyframes creatureHunt { from { transform: translateX(-3%) scale(.98) rotate(-1.5deg); } to { transform: translateX(5%) scale(1.02) rotate(.8deg); } }
    @keyframes creatureDefend { from { transform: scale(1); } to { transform: scale(1.045) translateY(-3px); } }
    .scene-claim-selected .depth-mid { animation: cameraFocus .66s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes cameraFocus { from { filter: blur(4px) brightness(.82); } to { filter: blur(0) brightness(1); } }
    .scene-near-25d::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 55%, transparent 42%, rgba(0,0,0,.34) 100%);
      pointer-events: none;
    }
    .habitat-scene.scene-25d-ready::after { z-index: 11; }
    .habitat-scene.scene-25d-ready .scene-info { z-index: 12; }
    .habitat-scene.scene-25d-ready .transition-overlay { z-index: 30; }

    @media (max-width: 1180px) {
      .evidence-grid { grid-template-columns: 1fr; }
      .evidence-card { min-height: auto; }
      .decision-landmark { width: clamp(120px, 20%, 168px); }
    }
    @media (max-width: 760px) {
      .landmark-copy strong, .landmark-copy span { font-size: 14px; }
      .landmark-art { height: 76px; }
      .decision-landmark { width: 30%; }
      .habitat-scene.scene-25d-ready .field-creature { width: min(38%,270px) !important; }
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Return to main menu">
        <span class="brand-mark">CD</span>
        <span class="brand-copy"><strong>Creature Design Lab</strong><span>CER Wildworld Expedition</span></span>
      </button>
      <div class="top-status" id="topStatus"></div>
      <div class="top-actions">
        <button class="icon-btn" id="helpButton"><span class="help-label">How to Play</span><span aria-hidden="true"> ?</span></button>
        <button class="icon-btn" id="restartButton" title="Restart experiment" aria-label="Restart experiment">↻</button>
        <button class="icon-btn" id="fullscreenButton"><span class="help-label">Full Screen</span><span aria-hidden="true"> ⛶</span></button>
      </div>
    </header>
    <main class="screen" id="screen"></main>
    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'creature-design-lab-cer-wildworld-v2';
      const BIO_BUDGET = 20;

      const TAG_LABELS = {
        heat: 'Extreme heat', cold: 'Deep cold', arid: 'Water scarcity', wet: 'Saturated ground',
        flood: 'Flooding', dark: 'Low light', vertical: 'Vertical terrain', open: 'Open terrain',
        scarcity: 'Food scarcity', toxins: 'Toxins', predators: 'Predators', disease: 'Disease pressure',
        wind: 'High winds', storm: 'Severe weather', lowOxygen: 'Low oxygen', debris: 'Unstable debris',
        plants: 'Plant food', prey: 'Mobile prey', mixed: 'Mixed food', urban: 'Artificial terrain'
      };

      const CATEGORIES = [
        {
          id: 'body', label: 'Body Plan', prompt: 'Choose the frame that everything else must support.',
          options: [
            { id:'tiny', name:'Compact Frame', cost:1, desc:'Low food demand and quick movement, but loses heat fast.', good:['Low food demand','Agile'], bad:['Cold','Predators'], effects:{heat:1,scarcity:2,vertical:1,cold:-2,predators:-1,wind:-1} },
            { id:'balanced', name:'Balanced Frame', cost:2, desc:'No extreme advantage, but few severe weaknesses.', good:['Stable','Flexible'], bad:['No major specialty'], effects:{heat:.5,cold:.5,debris:.5,scarcity:.5,wet:.5} },
            { id:'massive', name:'Massive Frame', cost:4, desc:'Stores heat and resists attack, but needs constant fuel.', good:['Cold','Defense'], bad:['Heat','Food demand'], effects:{cold:2,predators:2,debris:1,heat:-2,scarcity:-2,vertical:-2,lowOxygen:-1} },
            { id:'longlimbed', name:'Long-Limbed Frame', cost:3, desc:'Reaches, climbs, and crosses rough ground efficiently.', good:['Vertical terrain','Reach'], bad:['Wind','Debris'], effects:{vertical:2,open:1,wet:1,cold:-1,wind:-1,debris:-1} }
          ]
        },
        {
          id: 'surface', label: 'Surface', prompt: 'Select the outer layer that handles climate and damage.',
          options: [
            { id:'fur', name:'Insulating Fur', cost:3, desc:'Excellent thermal protection with a serious heat cost.', good:['Cold','Wind'], bad:['Heat','Wet climate'], effects:{cold:3,wind:1,heat:-3,wet:-1,disease:-1} },
            { id:'scales', name:'Reflective Scales', cost:2, desc:'Reflects heat and slows water loss.', good:['Heat','Dry climate'], bad:['Cold'], effects:{heat:2,arid:2,wet:1,cold:-2} },
            { id:'shell', name:'Armored Shell', cost:4, desc:'Heavy protection against impact, attack, and contamination.', good:['Predators','Debris'], bad:['Climbing','Food demand'], effects:{predators:3,debris:3,toxins:1,scarcity:-1,vertical:-2,flood:-1} },
            { id:'membrane', name:'Moist Membrane', cost:1, desc:'Breathes through a thin surface that must stay damp.', good:['Wet climate','Floods'], bad:['Dry climate','Toxins'], effects:{wet:3,flood:1,heat:1,arid:-3,cold:-1,toxins:-2,disease:-1} }
          ]
        },
        {
          id: 'movement', label: 'Movement', prompt: 'Decide how the creature crosses its environment.',
          options: [
            { id:'runner', name:'Sprinting Legs', cost:3, desc:'Explosive speed on open ground; poor in rubble and water.', good:['Open terrain','Escape'], bad:['Floods','Debris'], effects:{open:3,predators:1,scarcity:1,debris:-2,vertical:-1,flood:-2} },
            { id:'climber', name:'Climbing Grips', cost:3, desc:'Hooks and gripping pads dominate walls, trees, and ruins.', good:['Vertical terrain','Debris'], bad:['Open terrain','Wind'], effects:{vertical:3,debris:2,wet:1,open:-1,wind:-1} },
            { id:'glider', name:'Gliding Wings', cost:4, desc:'Crosses gaps and floods, but violent wind becomes dangerous.', good:['Vertical terrain','Floods'], bad:['Storms','Wind'], effects:{vertical:2,flood:2,predators:1,wind:-2,storm:-3,dark:-1} },
            { id:'swimmer', name:'Webbed Fins', cost:2, desc:'Fast and stable in water; awkward on steep dry terrain.', good:['Floods','Wet climate'], bad:['Dry climate','Cliffs'], effects:{flood:3,wet:3,storm:1,arid:-3,vertical:-2,open:-1} },
            { id:'burrower', name:'Burrowing Claws', cost:3, desc:'Builds shelter from heat, cold, and impact; floods are lethal.', good:['Dry climate','Cold'], bad:['Floods','Low oxygen'], effects:{arid:2,cold:2,dark:1,debris:1,flood:-3,lowOxygen:-1} }
          ]
        },
        {
          id: 'feeding', label: 'Feeding', prompt: 'Choose what keeps the population supplied with energy.',
          options: [
            { id:'grazer', name:'Specialized Grazer', cost:1, desc:'Efficient when plant growth is reliable, vulnerable when it is not.', good:['Plant food','Efficiency'], bad:['Scarcity','Cities'], effects:{plants:3,mixed:1,scarcity:-2,urban:-1} },
            { id:'hunter', name:'Active Hunter', cost:3, desc:'High-energy feeding that depends on finding and catching prey.', good:['Mobile prey','Defense'], bad:['Scarcity','Disease'], effects:{prey:3,predators:1,scarcity:-1,disease:-1} },
            { id:'omnivore', name:'Flexible Omnivore', cost:3, desc:'Uses many food sources without mastering any single one.', good:['Mixed food','Scarcity'], bad:['High cost'], effects:{mixed:3,urban:2,scarcity:2,plants:1,prey:1} },
            { id:'scavenger', name:'Resource Scavenger', cost:2, desc:'Finds value in leftovers and artificial environments.', good:['Cities','Scarcity'], bad:['Disease','Toxins'], effects:{urban:3,scarcity:2,mixed:1,toxins:-1,disease:-2} }
          ]
        },
        {
          id: 'sense', label: 'Primary Sense', prompt: 'Select the signal the creature trusts most.',
          options: [
            { id:'night', name:'Night Vision', cost:2, desc:'Large light-sensitive eyes reveal threats in darkness.', good:['Darkness','Predators'], bad:['No sound mapping'], effects:{dark:3,predators:1} },
            { id:'thermal', name:'Heat Sensing', cost:2, desc:'Tracks warm bodies through darkness and cover.', good:['Predators','Darkness'], bad:['Extreme heat','Storms'], effects:{dark:2,cold:1,predators:2,heat:-1,storm:-1} },
            { id:'smell', name:'Chemical Tracking', cost:2, desc:'Locates food over distance, but airborne hazards disrupt it.', good:['Food scarcity','Darkness'], bad:['Toxins','Storms'], effects:{scarcity:2,mixed:1,prey:1,dark:1,toxins:-1,storm:-1} },
            { id:'echo', name:'Echolocation', cost:3, desc:'Maps complex spaces precisely; wind and storms scatter signals.', good:['Darkness','Debris'], bad:['Wind','Storms'], effects:{dark:3,debris:2,vertical:1,wind:-2,storm:-2,open:-1} }
          ]
        },
        {
          id: 'social', label: 'Social Pattern', prompt: 'Decide how individuals cooperate—or avoid one another.',
          options: [
            { id:'solitary', name:'Solitary', cost:1, desc:'Low competition and low disease spread, but limited defense.', good:['Scarcity','Disease'], bad:['Predators','Cold'], effects:{scarcity:2,disease:2,predators:-1,cold:-1} },
            { id:'pair', name:'Bonded Pair', cost:2, desc:'Two individuals share defense and care with moderate demands.', good:['Balanced support'], bad:['Few extreme bonuses'], effects:{predators:1,scarcity:1,cold:1,disease:.5} },
            { id:'pack', name:'Coordinated Pack', cost:3, desc:'Powerful hunting and defense with a large food requirement.', good:['Predators','Prey'], bad:['Scarcity','Disease'], effects:{predators:3,prey:2,cold:1,scarcity:-2,disease:-1} },
            { id:'colony', name:'Dense Colony', cost:3, desc:'Shares heat and labor, while illness spreads rapidly.', good:['Cold','Defense'], bad:['Disease','Scarcity'], effects:{cold:3,debris:1,predators:1,disease:-3,scarcity:-2,heat:-1} }
          ]
        },
        {
          id: 'special', label: 'Signature Trait', prompt: 'Add one costly adaptation that can change the entire trial.',
          options: [
            { id:'reservoir', name:'Water Reservoir', cost:2, desc:'Stores water and reduces heat stress between feeding periods.', good:['Dry climate','Heat'], bad:['Cold','Floods'], effects:{arid:4,heat:2,scarcity:1,cold:-1,flood:-1} },
            { id:'camouflage', name:'Adaptive Camouflage', cost:3, desc:'Shifts pattern to break the body outline in changing terrain.', good:['Predators','Open terrain'], bad:['Energy cost'], effects:{predators:4,open:1,vertical:1,urban:1,storm:-1} },
            { id:'filters', name:'Toxin Filters', cost:3, desc:'Neutralizes pollutants, spores, and contaminated food.', good:['Toxins','Disease'], bad:['Food demand'], effects:{toxins:5,disease:2,scarcity:-1} },
            { id:'repair', name:'Rapid Tissue Repair', cost:4, desc:'Recovers from injury quickly, but consumes enormous energy.', good:['Debris','Storms'], bad:['Food scarcity'], effects:{debris:3,predators:2,storm:2,disease:1,scarcity:-3} }
          ]
        }
      ];

      const ENVIRONMENTS = [
        {
          id:'desert', code:'V-03', name:'The Glass Dunes', intro:'A mineral desert where heat, wind, and water scarcity change by the hour.',
          challenges:{heat:3,arid:3,scarcity:2,open:2,predators:1}, weather:'dust',
          situations:[
            {
              id:'desert-water', title:'The Vanishing Basin', scene:'dawn', tone:'hot', weather:'none',
              question:'Which water source should the population use first?',
              situation:'At sunrise, the scouts locate three possible water sources. The heat will make only one early trip practical.',
              pressures:{heat:2,arid:3,scarcity:1},
              evidence:[
                {id:'d-w1', text:'Fresh tracks from several species converge on the exposed mineral spring.', supports:['spring','trail'], contradicts:[]},
                {id:'d-w2', text:'The spring is 1.4 kilometers away across open salt flats.', supports:['spring'], contradicts:['dew']},
                {id:'d-w3', text:'Broad desert leaves hold droplets before the sun reaches them.', supports:['dew'], contradicts:[]},
                {id:'d-w4', text:'The dew plants are scattered, so the population would need to feed in small groups.', supports:['dew'], contradicts:['spring']},
                {id:'d-w5', text:'A slow-moving herd repeatedly disappears behind a line of shaded rocks.', supports:['trail'], contradicts:[]},
                {id:'d-w6', text:'Following another species may reveal water, but it also increases predator exposure.', supports:['trail'], contradicts:['spring','dew']}
              ],
              claims:[
                {id:'spring', text:'The population should travel directly to the mineral spring.', short:'Mineral spring', risk:'Bold', desc:'Reach a large water source before surface temperatures peak.', boost:['runner','longlimbed','scales','reservoir','pack'], penalty:['massive','fur','membrane'], effect:{population:1,energy:-8,resources:14}, reasoning:'a concentrated water source can restore the whole population, but only if its movement and heat-control traits can handle the exposed crossing.', outcome:'The population commits to a fast crossing toward the spring.', continuation:'The spring restores water reserves, but the open route leaves the group visible on the flats.', scene:'water'},
                {id:'dew', text:'The population should harvest dew from the desert plants.', short:'Dew plants', risk:'Controlled', desc:'Collect smaller amounts nearby before they evaporate.', boost:['tiny','grazer','solitary','pair','membrane'], penalty:['massive','pack','colony'], effect:{population:2,energy:-2,resources:7}, reasoning:'nearby droplets reduce travel and heat exposure, while smaller social groups can gather from scattered plants without exhausting one patch.', outcome:'Individuals spread among the dew plants and gather water at first light.', continuation:'The group remains close to shelter, although its water supply is limited and dispersed.', scene:'feed'},
                {id:'trail', text:'The population should follow the herd toward hidden water.', short:'Follow the herd', risk:'Adaptive', desc:'Use the behavior of other animals as environmental evidence.', boost:['smell','night','camouflage','scavenger','pair'], penalty:['grazer','colony','shell'], effect:{population:0,energy:-4,resources:10}, reasoning:'repeated animal movement can reveal a protected water source, especially when tracking and concealment reduce the risk of following competitors.', outcome:'The population shadows the herd through the rock shadows.', continuation:'The herd leads toward a narrow basin, bringing both water access and nearby predators.', scene:'move'}
              ]
            },
            {
              id:'desert-storm', title:'Glasswind Warning', scene:'storm', tone:'hazard', weather:'dust',
              question:'Which route should the population take before the glasswind arrives?',
              situation:'A wall of abrasive dust is moving toward the basin. Three routes lead away, but each exposes a different weakness.',
              pressures:{storm:3,debris:2,arid:1,open:2},
              evidence:[
                {id:'d-s1', text:'The canyon blocks most crosswind, but loose stone covers its floor.', supports:['canyon'], contradicts:['flat']},
                {id:'d-s2', text:'The shortest route crosses smooth salt flats with no shelter.', supports:['flat'], contradicts:['canyon','burrow']},
                {id:'d-s3', text:'The storm front is moving faster than walking speed.', supports:['flat','burrow'], contradicts:[]},
                {id:'d-s4', text:'Compact dunes can be excavated quickly, but the air below them becomes stale.', supports:['burrow'], contradicts:['flat']},
                {id:'d-s5', text:'Abrasive particles damage exposed membranes and eyes.', supports:['canyon','burrow'], contradicts:['flat']},
                {id:'d-s6', text:'The canyon exit lies beyond a field of unstable rock shards.', supports:['canyon'], contradicts:['burrow']}
              ],
              claims:[
                {id:'canyon', text:'The population should move through the sheltered canyon.', short:'Sheltered canyon', risk:'Balanced', desc:'Trade unstable ground for protection from the strongest wind.', boost:['climber','shell','echo','repair','longlimbed'], penalty:['runner','glider','swimmer'], effect:{population:0,energy:-5,resources:-1}, reasoning:'the canyon reduces direct wind and abrasion, while climbing, mapping, or impact-resistant traits can manage the unstable debris.', outcome:'The population enters the canyon as the first dust reaches the rim.', continuation:'The storm passes overhead, but falling stone forces the group onto a higher ledge.', scene:'shelter'},
                {id:'flat', text:'The population should sprint across the salt flats.', short:'Salt-flat sprint', risk:'Bold', desc:'Attempt to outrun the front on the shortest path.', boost:['runner','tiny','scales','night','pack'], penalty:['massive','fur','shell','glider'], effect:{population:-2,energy:-12,resources:2}, reasoning:'a short exposed route can work only when speed, low mass, and heat tolerance allow the population to clear the flats before the storm overtakes it.', outcome:'The population accelerates across the open salt flats.', continuation:'The front catches the slowest individuals, separating the group near a field of black rocks.', scene:'open'},
                {id:'burrow', text:'The population should dig in and wait beneath the dunes.', short:'Dune shelter', risk:'Controlled', desc:'Avoid travel and build temporary cover before impact.', boost:['burrower','tiny','reservoir','solitary','filters'], penalty:['massive','colony','glider'], effect:{population:1,energy:-3,resources:-4}, reasoning:'buried shelter reduces abrasion and wind exposure, but the design must tolerate limited air and have enough stored energy to wait safely.', outcome:'The population excavates shallow chambers and seals the entrances.', continuation:'The storm covers the burrows, preserving the group but delaying its search for food.', scene:'low'}
              ]
            },
            {
              id:'desert-food', title:'The Last Feeding Window', scene:'dusk', tone:'night', weather:'none',
              question:'What should the population eat before the desert night begins?',
              situation:'Water has been found, but energy reserves are falling. Three food sources appear before darkness brings new predators.',
              pressures:{scarcity:3,predators:2,dark:2,heat:1},
              evidence:[
                {id:'d-f1', text:'Seed pods are abundant but protected by hard, fibrous shells.', supports:['seeds'], contradicts:['insects']},
                {id:'d-f2', text:'Small insects emerge from cool sand as surface temperature drops.', supports:['insects'], contradicts:[]},
                {id:'d-f3', text:'A fresh carcass lies downwind near several predator tracks.', supports:['carrion'], contradicts:['seeds']},
                {id:'d-f4', text:'The seed patch is exposed and will be visible after moonrise.', supports:['seeds'], contradicts:['carrion']},
                {id:'d-f5', text:'Capturing insects requires rapid movement over loose sand.', supports:['insects'], contradicts:['seeds']},
                {id:'d-f6', text:'The carcass offers the most energy but may carry disease or toxins.', supports:['carrion'], contradicts:['insects']}
              ],
              claims:[
                {id:'seeds', text:'The population should feed on the seed pods.', short:'Seed pods', risk:'Controlled', desc:'Use a predictable plant resource before leaving the exposed patch.', boost:['grazer','omnivore','shell','colony','massive'], penalty:['hunter','scavenger','tiny'], effect:{population:1,energy:8,resources:5}, reasoning:'a reliable plant source can supply many individuals when the feeding structures and social pattern can process tough pods efficiently.', outcome:'The population gathers around the seed patch and breaks open the pods.', continuation:'The group gains steady energy but remains visible as the temperature falls.', scene:'feed'},
                {id:'insects', text:'The population should hunt the emerging insects.', short:'Sand insects', risk:'Adaptive', desc:'Use a brief prey pulse that appears only at dusk.', boost:['hunter','runner','night','thermal','pack','tiny'], penalty:['massive','grazer','shell'], effect:{population:0,energy:10,resources:3}, reasoning:'a short-lived prey pulse rewards speed and detection, allowing an active feeder to gain energy without remaining at one exposed site.', outcome:'Hunters spread across the cooling sand and intercept the insect emergence.', continuation:'The chase replenishes energy while drawing the population farther from its shelter.', scene:'hunt'},
                {id:'carrion', text:'The population should scavenge the fresh carcass.', short:'Fresh carrion', risk:'Bold', desc:'Gain a large meal while managing contamination and competition.', boost:['scavenger','filters','smell','camouflage','solitary'], penalty:['grazer','colony','membrane'], effect:{population:-1,energy:14,resources:7}, reasoning:'carrion offers concentrated energy, but scavenging, toxin protection, and concealment are needed to reduce disease and predator competition.', outcome:'The population approaches downwind and feeds quickly from the carcass.', continuation:'Energy rises sharply, although scent and tracks now reveal the group’s location.', scene:'feed'}
              ]
            }
          ]
        },
        {
          id:'polar', code:'K-11', name:'The Polar Basin', intro:'A frozen plain with little cover, unstable ice, and rapidly shifting weather.',
          challenges:{cold:3,wind:2,scarcity:2,open:2,storm:1}, weather:'snow',
          situations:[
            {
              id:'polar-shelter', title:'Temperature Collapse', scene:'storm', tone:'cold', weather:'snow',
              question:'Where should the population shelter during the sudden temperature drop?',
              situation:'The wind changes direction and the temperature falls rapidly. The population must choose shelter before exposed tissue begins to freeze.',
              pressures:{cold:4,wind:3,storm:2},
              evidence:[
                {id:'p-sh1', text:'A deep snowbank contains trapped air that insulates better than exposed ice.', supports:['snowbank'], contradicts:['move']},
                {id:'p-sh2', text:'A rocky vent releases warm vapor but coats nearby ice with moisture.', supports:['vent'], contradicts:['snowbank']},

                {id:'h-o5', text:'Descending would require climbing the same elevation again later.', supports:['descend'], contradicts:['rest']},
                {id:'h-o6', text:'The fastest individuals are still moving normally.', supports:['rush'], contradicts:['rest']}

              claims:[
                {id:'rest', text:'The population should rest behind the rock wall.', short:'Sheltered rest', risk:'Controlled', desc:'Recover breathing and coordination before continuing.', boost:['massive','fur','colony','pair','reservoir'], penalty:['runner','hunter','tiny'], effect:{population:2,energy:2,resources:-7}, reasoning:'the calm pocket lowers wind and activity demand, allowing oxygen recovery when insulation, shared support, or stored resources can sustain the pause.', outcome:'The population shelters behind the wall and reduces all movement.', continuation:'Breathing stabilizes, but the group uses food and loses part of the weather window.', scene:'shelter'},
                {id:'descend', text:'The population should descend to the flowering meadow.', short:'Descend to meadow', risk:'Adaptive', desc:'Trade progress for denser air and a food source.', boost:['climber','longlimbed','grazer','omnivore','pair'], penalty:['glider','runner','pack'], effect:{population:1,energy:-5,resources:9}, reasoning:'lower elevation provides denser air and food, while controlled movement and flexible feeding can restore the population before another ascent.', outcome:'The population turns downslope toward the flowering meadow.', continuation:'Oxygen stress falls and resources rise, but the route to the pass becomes longer.', scene:'low'},
                {id:'rush', text:'The population should push rapidly toward the nearby pass.', short:'Push to pass', risk:'Bold', desc:'Finish the high-altitude section before more individuals weaken.', boost:['runner','tiny','pack','night','repair'], penalty:['massive','colony','shell'], effect:{population:-3,energy:-12,resources:-2}, reasoning:'a nearby destination can end exposure quickly, but speed, low oxygen demand, coordination, or rapid recovery are needed to prevent collapse during the final push.', outcome:'The population accelerates toward the pass despite the thin air.', continuation:'The front reaches shelter quickly, while weakened individuals arrive later and require recovery.', scene:'move'}
              ]
            },
            {
              id:'highlands-storm', title:'Downdraft Front', scene:'storm', tone:'hazard', weather:'snow',
              question:'Where should the population shelter from the downdraft storm?',
              situation:'A wall of descending air sweeps across the ridge. A rock crevice, a snowfield, and anchored shrubs offer three forms of protection.',
              pressures:{storm:4,wind:4,cold:2,debris:1},
              evidence:[
                {id:'h-s1', text:'A narrow crevice blocks most wind but has little space.', supports:['crevice'], contradicts:['shrubs']},
                {id:'h-s2', text:'Deep snow can be excavated into insulated chambers.', supports:['snow'], contradicts:['crevice']},
                {id:'h-s3', text:'Dense shrubs are strongly rooted and bend without breaking.', supports:['shrubs'], contradicts:[]},
                {id:'h-s4', text:'Loose stones are falling into the crevice entrance.', supports:['crevice'], contradicts:['snow']},
                {id:'h-s5', text:'The snowfield lies directly below the strongest downdraft.', supports:['snow'], contradicts:['shrubs']},
                {id:'h-s6', text:'The shrubs provide anchors but little insulation from cold.', supports:['shrubs'], contradicts:['crevice']}
              ],
              claims:[
                {id:'crevice', text:'The population should shelter inside the rock crevice.', short:'Rock crevice', risk:'Adaptive', desc:'Use a rigid windbreak while managing crowding and falling stone.', boost:['tiny','shell','burrower','pair','repair'], penalty:['massive','colony','glider'], effect:{population:1,energy:-3,resources:-3}, reasoning:'the crevice blocks direct wind, while small size, armor, digging, or repair can reduce crowding and rockfall risk.', outcome:'The population enters the crevice in compact groups.', continuation:'The wind is blocked, but falling stone narrows the exit during the storm.', scene:'shelter'},
                {id:'snow', text:'The population should dig shelters into the snowfield.', short:'Snow chambers', risk:'Controlled', desc:'Create insulated spaces before the downdraft peaks.', boost:['burrower','fur','colony','massive','reservoir'], penalty:['membrane','runner','glider'], effect:{population:2,energy:-5,resources:-5}, reasoning:'snow chambers trap insulating air and reduce wind exposure, while digging, insulation, group warmth, or reserves support the building effort.', outcome:'The population excavates connected chambers beneath the snow surface.', continuation:'The shelter preserves heat, but drifting snow buries landmarks and slows departure.', scene:'low'},
                {id:'shrubs', text:'The population should anchor itself among the rooted shrubs.', short:'Rooted shrubs', risk:'Bold', desc:'Hold position in flexible cover rather than entering confined shelter.', boost:['climber','longlimbed','pack','shell','camouflage'], penalty:['tiny','glider','membrane'], effect:{population:-2,energy:-8,resources:1}, reasoning:'strong roots provide physical anchors, while gripping, reach, coordination, or armor can prevent individuals from being blown from the ridge.', outcome:'The population locks onto the shrub network as the downdraft strikes.', continuation:'The group remains near its route, but cold wind causes injuries and high energy loss.', scene:'defend'}
              ]
            }
          ]
        }
      ];

      const SYNERGIES = [
        {ids:['fur','colony'], tags:['cold'], value:5, label:'Shared insulation'},
        {ids:['hunter','pack'], tags:['prey','predators'], value:5, label:'Coordinated hunting'},
        {ids:['scavenger','smell'], tags:['scarcity','urban'], value:4, label:'Resource tracking'},
        {ids:['membrane','swimmer'], tags:['wet','flood'], value:5, label:'Aquatic respiration'},
        {ids:['shell','burrower'], tags:['debris'], value:4, label:'Reinforced shelter'},
        {ids:['tiny','glider'], tags:['vertical','flood'], value:4, label:'Low-mass gliding'},
        {ids:['scales','reservoir'], tags:['heat','arid'], value:5, label:'Desert water control'},
        {ids:['echo','climber'], tags:['dark','vertical','debris'], value:4, label:'Three-dimensional mapping'},
        {ids:['filters','scavenger'], tags:['toxins','urban','disease'], value:4, label:'Safe salvage'},
        {ids:['repair','massive'], tags:['predators','debris','storm'], value:4, label:'Damage tolerance'}
      ];

      const NAME_PARTS = {
        first:['Astra','Velo','Mira','Kryo','Nexo','Terra','Zyra','Orin','Cinder','Luma','Rift','Echo','Nova','Vanta','Brine','Talon'],
        second:['morph','drake','fin','claw','wing','stride','shell','lynx','mite','runner','grazer','shade','crest','stalker','weaver','back']
      };

      let savedRun = loadRun();
      let currentView = 'home';
      let simulationBusy = false;
      let simulationText = '';
      let toastTimer = null;

      const screen = document.getElementById('screen');
      const topStatus = document.getElementById('topStatus');
      const modalRoot = document.getElementById('modalRoot');
      const toast = document.getElementById('toast');

      function freshRun() {
        return {
          version: 2,
          phase: 'build',
          buildStep: 0,
          selections: {},
          speciesName: generateName(),
          worlds: [],
          worldIndex: 0,
          situationIndex: 0,
          currentClaim: null,
          selectedEvidence: [],
          selectedReasoning: null,
          scenarioResults: [],
          worldReports: [],
          stats: {population:72, energy:72, resources:55},
          createdAt: Date.now(),
          completed: false,
          sceneTransition: false
        };
      }

      function loadRun() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (!parsed || parsed.version !== 2 || !parsed.phase) return null;
          parsed.selectedEvidence = Array.isArray(parsed.selectedEvidence) ? parsed.selectedEvidence : [];
          parsed.scenarioResults = Array.isArray(parsed.scenarioResults) ? parsed.scenarioResults : [];
          parsed.worldReports = Array.isArray(parsed.worldReports) ? parsed.worldReports : [];
          parsed.stats = parsed.stats || {population:72,energy:72,resources:55};
          return parsed;
        } catch (error) {
          return null;
        }
      }

      function saveRun() {
        if (!savedRun) return;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(savedRun)); }
        catch (error) { showToast('Progress could not be saved in this browser.'); }
      }

      function clearRun() {
        savedRun = null;
        try { localStorage.removeItem(STORAGE_KEY); } catch (error) {}
      }

      function generateName() {
        const a = NAME_PARTS.first[Math.floor(Math.random() * NAME_PARTS.first.length)];
        const b = NAME_PARTS.second[Math.floor(Math.random() * NAME_PARTS.second.length)];
        return a + b;
      }

      function getOption(id) {
        for (const category of CATEGORIES) {
          const option = category.options.find(item => item.id === id);
          if (option) return option;
        }
        return null;
      }

      function selectedOptions(run = savedRun) {
        if (!run) return [];
        return CATEGORIES.map(category => getOption(run.selections[category.id])).filter(Boolean);
      }

      function spentBudget(run = savedRun) {
        return selectedOptions(run).reduce((sum, option) => sum + option.cost, 0);
      }

      function completedCategories(run = savedRun) {
        if (!run) return 0;
        return CATEGORIES.filter(category => run.selections[category.id]).length;
      }

      function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }
      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2100);
      }

      function setView(view) {
        currentView = view;
        window.scrollTo({top:0, behavior:'smooth'});
        render();
      }

      function render() {
        updateHeader();
        if (currentView === 'home') renderHome();
        else if (!savedRun) { currentView = 'home'; renderHome(); }
        else if (currentView === 'build') renderBuilder();
        else if (currentView === 'trial') renderTrial();
        else if (currentView === 'trialResult') renderTrialResult();
        else if (currentView === 'worldResult') renderWorldResult();
        else if (currentView === 'final') renderFinal();
        else renderHome();
      }

      function updateHeader() {
        let text = 'Offline expedition • Progress saves automatically';
        if (savedRun && currentView !== 'home') {
          if (currentView === 'build') text = `Genome sequence • ${completedCategories()}/7 traits • ${spentBudget()}/${BIO_BUDGET} bio-points`;
          if (currentView === 'trial') text = `${savedRun.speciesName} • World ${Math.min(savedRun.worldIndex + 1, 3)}/3 • Situation ${Math.min(savedRun.situationIndex + 1, 3)}/3`;
          if (currentView === 'trialResult') text = `${savedRun.speciesName} • CER consequence • Population ${Math.round(savedRun.stats.population)}%`;
          if (currentView === 'worldResult') text = `${savedRun.speciesName} • World ${Math.min(savedRun.worldIndex + 1, 3)} field report`;
          if (currentView === 'final') text = `${savedRun.speciesName} • CER expedition complete`;
        }
        topStatus.innerHTML = `<div class="status-pill"><span class="status-dot"></span><span>${escapeHTML(text)}</span></div>`;
        document.getElementById('restartButton').style.visibility = savedRun ? 'visible' : 'hidden';
      }

      function renderHome() {
        const demoSelections = {
          body:'balanced', surface:'scales', movement:'climber', feeding:'omnivore',
          sense:'echo', social:'pair', special:'camouflage'
        };
        const hasRun = Boolean(savedRun);
        const resumeLabel = savedRun?.completed ? 'View final report' : 'Continue expedition';
        const resumeMeta = savedRun ? `${escapeHTML(savedRun.speciesName)} • ${describeProgress(savedRun)}` : '';
        screen.innerHTML = `
          <section class="home-grid">
            <div class="home-copy">
              <p class="eyebrow">CER Wildworld Expedition</p>
              <h1 class="home-title">DESIGN.<br><span>ARGUE.</span><br>ADAPT.</h1>
              <p class="home-lede">Build a species, then guide it through nine connected survival situations. Every decision uses Claim, Evidence, and Reasoning—and every choice changes the population, resources, and path forward.</p>
              <div class="home-actions">
                <button class="primary-btn" data-action="new-run">Start New Expedition</button>
                <button class="secondary-btn" data-action="how">How It Works</button>
              </div>
              ${hasRun ? `<div class="resume-card"><div><strong>${resumeMeta}</strong><span>Saved on this device</span></div><button class="small-btn" data-action="continue">${resumeLabel}</button></div>` : ''}
              <div class="feature-row">
                <span class="feature-chip">24 habitat situations</span>
                <span class="feature-chip">9 CER decisions per run</span>
                <span class="feature-chip">Choices alter later scenes</span>
                <span class="feature-chip">No dead ends</span>
              </div>
            </div>
            <div class="tank-wrap" aria-hidden="true">
              <div class="tank-glow"></div>
              <div class="tank">
                <span class="tank-label">Specimen preview / awaiting field protocol</span>
                ${renderCreatureSVG(demoSelections, 'home')}
              </div>
            </div>
          </section>`;
      }

      function describeProgress(run) {
        if (run.completed || run.phase === 'final') return 'completed expedition';
        if (run.phase === 'build') return `${completedCategories(run)}/7 traits selected`;
        if (run.phase === 'worldResult') return `world ${Math.min(run.worldIndex + 1,3)} report`;
        return `world ${Math.min(run.worldIndex + 1,3)} • situation ${Math.min(run.situationIndex + 1,3)}`;
      }

      function renderBuilder() {
        const step = clamp(savedRun.buildStep, 0, CATEGORIES.length);
        const reviewMode = step >= CATEGORIES.length;
        const used = spentBudget();
        const remaining = BIO_BUDGET - used;
        const over = remaining < 0;
        const completion = completedCategories();
        const category = CATEGORIES[Math.min(step, CATEGORIES.length - 1)];

        screen.innerHTML = `
          <section class="builder-shell">
            <div class="panel builder-main">
              <div class="builder-topline">
                <div>
                  <div class="step-kicker">${reviewMode ? 'Genome review' : `Sequence ${step + 1} of ${CATEGORIES.length}`}</div>
                  <h2>${reviewMode ? 'Finalize the species' : escapeHTML(category.label)}</h2>
                  <p>${reviewMode ? 'Every trait is locked to the same biological budget. Change any category before release.' : escapeHTML(category.prompt)}</p>
                </div>
                <div class="budget-box" aria-label="Biological budget">
                  <div class="budget-line"><span>Bio-points used</span><strong>${used} / ${BIO_BUDGET}</strong></div>
                  <div class="budget-bar"><div class="budget-fill ${over ? 'over' : ''}" style="width:${clamp((used / BIO_BUDGET) * 100, 0, 100)}%"></div></div>
                  <div class="budget-line" style="margin-top:7px"><span>${over ? 'Over budget' : 'Energy reserve'}</span><strong class="${over ? 'negative' : 'positive'}">${over ? Math.abs(remaining) : remaining}</strong></div>
                </div>
              </div>
              ${renderCategoryNav(step)}
              ${reviewMode ? renderGenomeReview(used, remaining) : renderTraitSelection(category)}
              <div class="builder-footer">
                <div class="builder-footer-group">
                  <button class="ghost-btn" data-action="builder-back" ${step === 0 ? 'disabled' : ''}>Back</button>
                  <button class="secondary-btn" data-action="randomize">Randomize Genome</button>
                </div>
                <div class="builder-footer-group">
                  ${reviewMode
                    ? `<button class="primary-btn" data-action="launch" ${completion < CATEGORIES.length || over ? 'disabled' : ''}>Begin Wildworld Trials</button>`
                    : `<button class="primary-btn" data-action="builder-next" ${!savedRun.selections[category.id] ? 'disabled' : ''}>${step === CATEGORIES.length - 1 ? 'Review Genome' : 'Next Trait'}</button>`}
                </div>
              </div>
            </div>
            <aside class="panel preview-panel">
              <div class="preview-stage">${renderCreatureSVG(savedRun.selections, 'builder')}</div>
              <div class="genome-summary">
                <div class="summary-row"><span>Species</span><strong>${escapeHTML(savedRun.speciesName)}</strong></div>
                <div class="summary-row"><span>Genome completion</span><strong>${completion} / 7</strong></div>
                <div class="summary-row"><span>Energy reserve</span><strong class="${over ? 'negative' : ''}">${remaining}</strong></div>
              </div>
            </aside>
          </section>`;
      }

      function renderCategoryNav(activeStep) {
        return `<nav class="category-nav" aria-label="Genome categories">${CATEGORIES.map((category, index) => {
          const done = Boolean(savedRun.selections[category.id]);
          return `<button class="category-step ${index === activeStep ? 'active' : ''} ${done ? 'done' : ''}" data-action="jump-step" data-step="${index}">
            <span class="step-number">${done ? '✓' : index + 1}</span>
            <span>${escapeHTML(category.label)}</span>
          </button>`;
        }).join('')}</nav>`;
      }

      function renderTraitSelection(category) {
        return `<div class="trait-grid">${category.options.map(option => {
          const selected = savedRun.selections[category.id] === option.id;
          return `<button class="trait-card ${selected ? 'selected' : ''}" data-action="select-trait" data-category="${category.id}" data-option="${option.id}" aria-pressed="${selected}">
            <div class="trait-head"><h3>${escapeHTML(option.name)}</h3><span class="cost-chip">${option.cost} BP</span></div>
            <p>${escapeHTML(option.desc)}</p>
            <div class="trait-effects">
              ${option.good.map(text => `<span class="effect-good">+ ${escapeHTML(text)}</span>`).join('')}
              ${option.bad.map(text => `<span class="effect-bad">− ${escapeHTML(text)}</span>`).join('')}
            </div>
          </button>`;
        }).join('')}</div>`;
      }

      function renderGenomeReview(used, remaining) {
        return `
          <div class="review-grid">
            ${CATEGORIES.map((category, index) => {
              const option = getOption(savedRun.selections[category.id]);
              return `<button class="review-trait" data-action="jump-step" data-step="${index}"><span>${escapeHTML(category.label)}</span><strong>${option ? escapeHTML(option.name) : 'Not selected'}</strong></button>`;
            }).join('')}
          </div>
          <div class="name-field">
            <label for="speciesName">Species name</label>
            <div class="name-row">
              <input id="speciesName" maxlength="24" value="${escapeHTML(savedRun.speciesName)}" autocomplete="off" />
              <button class="small-btn" data-action="new-name">Generate</button>
            </div>
          </div>
          ${remaining < 0
            ? `<div class="warning-box"><strong>Genome exceeds the biological budget by ${Math.abs(remaining)} point${Math.abs(remaining) === 1 ? '' : 's'}.</strong> Replace one or more expensive traits before release.</div>`
            : `<div class="info-box"><strong>${remaining} reserve point${remaining === 1 ? '' : 's'} available.</strong> Unused bio-points become stored energy and provide a small survival bonus in every habitat.</div>`}
        `;
      }

      function randomizeGenome() {
        let attempts = 0;
        let selections;
        do {
          selections = {};
          CATEGORIES.forEach(category => {
            selections[category.id] = category.options[Math.floor(Math.random() * category.options.length)].id;
          });
          attempts++;
        } while (spentBudget({selections}) > BIO_BUDGET && attempts < 200);
        savedRun.selections = selections;
        savedRun.speciesName = generateName();
        savedRun.buildStep = CATEGORIES.length;
        saveRun();
        render();
        showToast('A viable genome was generated.');
      }

      function beginTrials() {
        if (completedCategories() < CATEGORIES.length || spentBudget() > BIO_BUDGET) return;
        if (!savedRun.speciesName.trim()) savedRun.speciesName = generateName();
        savedRun.worlds = shuffle(ENVIRONMENTS).slice(0, 3).map(env => ({
          envId: env.id,
          situationIds: env.situations.map(situation => situation.id)
        }));
        savedRun.phase = 'cer';
        savedRun.worldIndex = 0;
        savedRun.situationIndex = 0;
        savedRun.currentClaim = null;
        savedRun.selectedEvidence = [];
        savedRun.selectedReasoning = null;
        savedRun.scenarioResults = [];
        savedRun.worldReports = [];
        savedRun.stats = {population:72, energy:72, resources:55};
        savedRun.completed = false;
        savedRun.sceneTransition = true;
        saveRun();
        setView('trial');
      }

      function getCurrentExpedition() {
        const worldRef = savedRun?.worlds?.[savedRun.worldIndex];
        const env = ENVIRONMENTS.find(item => item.id === worldRef?.envId);
        const situationId = worldRef?.situationIds?.[savedRun.situationIndex];
        const situation = env?.situations.find(item => item.id === situationId) || env?.situations?.[savedRun.situationIndex];
        return {worldRef, env, situation};
      }

      function getSituationByResult(result) {
        const env = ENVIRONMENTS.find(item => item.id === result?.envId);
        const situation = env?.situations.find(item => item.id === result?.situationId);
        const claim = situation?.claims.find(item => item.id === result?.claimId);
        return {env, situation, claim};
      }

      function mergedScenarioPressures(env, situation) {
        const merged = {...(situation?.pressures || {})};
        Object.entries(env?.challenges || {}).forEach(([tag, severity]) => {
          merged[tag] = (merged[tag] || 0) + severity * .35;
        });
        return merged;
      }

      function renderWorldProgress() {
        return `<div class="trial-progress">${[0,1,2].map(index => {
          const ref = savedRun.worlds[index];
          const env = ENVIRONMENTS.find(item => item.id === ref?.envId);
          const report = savedRun.worldReports.find(item => item.worldIndex === index);
          const completedInWorld = savedRun.scenarioResults.filter(item => item.worldIndex === index).length;
          const done = Boolean(report) || index < savedRun.worldIndex;
          const active = index === savedRun.worldIndex && currentView !== 'final';
          const visibleProgress = completedInWorld + (active && currentView === 'trial' ? 1 : 0);
          return `<div class="trial-node ${done ? 'done' : ''} ${active ? 'active' : ''}">
            <strong>${done ? '✓ ' : ''}World ${index + 1}</strong>
            <span>${env ? `${escapeHTML(env.code)} • ${done ? '3/3' : `${Math.min(visibleProgress, 3)}/3`}` : 'Unknown'}</span>
          </div>`;
        }).join('')}</div>`;
      }

      function currentCERStage() {
        if (!savedRun.currentClaim) return 'claim';
        if ((savedRun.selectedEvidence || []).length < 2) return 'evidence';
        if (!savedRun.selectedReasoning) return 'reasoning';
        return 'ready';
      }

      function renderCERSteps() {
        const stage = currentCERStage();
        const order = ['claim','evidence','reasoning'];
        const activeIndex = stage === 'ready' ? 2 : order.indexOf(stage);
        return `<div class="cer-steps">${order.map((item,index) => {
          const done = item === 'claim' ? Boolean(savedRun.currentClaim) : item === 'evidence' ? (savedRun.selectedEvidence || []).length === 2 : Boolean(savedRun.selectedReasoning);
          const active = stage === 'ready' ? item === 'reasoning' : index === activeIndex;
          return `<div class="cer-step ${done ? 'done' : ''} ${active ? 'active' : ''}"><b>${done ? '✓' : index + 1}</b><span>${item}</span></div>`;
        }).join('')}</div>`;
      }

      function renderMetrics(stats = savedRun.stats) {
        const values = stats || {population:0,energy:0,resources:0};
        const rows = [
          ['Population', values.population, 'metric-pop'],
          ['Energy', values.energy, 'metric-energy'],
          ['Resources', values.resources, 'metric-resource']
        ];
        return `<div class="metric-grid">${rows.map(([label,value,klass]) => `<div class="metric-card ${klass}"><div class="metric-head"><span>${label}</span><strong>${Math.round(value)}%</strong></div><div class="metric-bar"><span style="width:${clamp(value,0,100)}%"></span></div></div>`).join('')}</div>`;
      }

      function renderPressureChips(env, situation) {
        return Object.entries(mergedScenarioPressures(env, situation))
          .sort((a,b) => b[1] - a[1])
          .slice(0, 6)
          .map(([tag,severity]) => `<span class="challenge-chip">${escapeHTML(TAG_LABELS[tag] || tag)} <b>${'•'.repeat(clamp(Math.round(severity),1,5))}</b></span>`)
          .join('');
      }

      function buildEvidencePool(situation, claim) {
        const fieldEvidence = (situation?.evidence || []).map(item => ({...item, source:'Field observation'}));
        if (!claim) return fieldEvidence;
        const options = selectedOptions();
        const positive = options.filter(option => (claim.boost || []).includes(option.id)).slice(0,2);
        const negative = options.filter(option => (claim.penalty || []).includes(option.id)).slice(0,1);
        const dynamic = [];
        positive.forEach(option => dynamic.push({
          id:`genome-plus-${option.id}`,
          text:`Genome scan: ${option.name}. ${option.desc}`,
          supports:[claim.id], contradicts:[], source:'Genome evidence'
        }));
        negative.forEach(option => dynamic.push({
          id:`genome-risk-${option.id}`,
          text:`Genome risk: ${option.name}. ${option.desc}`,
          supports:[], contradicts:[claim.id], source:'Genome evidence'
        }));
        if (!dynamic.length && options.length) {
          const option = options[0];
          dynamic.push({
            id:`genome-neutral-${option.id}`,
            text:`Genome scan: ${option.name}. ${option.desc}`,
            supports:[], contradicts:[], source:'Genome evidence'
          });
        }
        return [...fieldEvidence, ...dynamic].slice(0,8);
      }

      function hashString(value) {
        let hash = 2166136261;
        for (const char of String(value)) {
          hash ^= char.charCodeAt(0);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function stableShuffle(array, seedText) {
        const copy = [...array];
        let seed = hashString(seedText) || 1;
        const random = () => {
          seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
          return seed / 4294967296;
        };
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function getReasoningOptions(situation, claim) {
        if (!claim) return [];
        const partials = [
          `The habitat contains several risks, so ${claim.short.toLowerCase()} may help the population survive.`,
          `One field observation is related to ${claim.short.toLowerCase()}, and living things often adjust when conditions change.`,
          `${claim.short} could reduce one immediate problem, although this explanation does not connect both pieces of evidence to the creature’s biology.`
        ];
        const weak = [
          `${claim.short} is the best claim because it is the option I selected.`,
          `This choice should work because it sounds safer than the other choices.`,
          `The population will survive if it tries hard enough, so this claim must be correct.`
        ];
        const seed = `${situation.id}-${claim.id}-${savedRun.speciesName}`;
        const partial = partials[hashString(seed) % partials.length];
        const circular = weak[hashString(`${seed}-weak`) % weak.length];
        return stableShuffle([
          {id:'causal', quality:100, text:`The evidence supports this claim because ${claim.reasoning}`},
          {id:'partial', quality:58, text:partial},
          {id:'circular', quality:22, text:circular}
        ], seed);
      }

      function getPreviousWorldResult() {
        return [...(savedRun.scenarioResults || [])].reverse().find(item => item.worldIndex === savedRun.worldIndex) || null;
