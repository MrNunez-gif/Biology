      function renderWeather(type) {
        if (!type || type === 'none') return '';
        const count = type === 'rain' ? 32 : type === 'smog' ? 14 : type === 'spores' ? 26 : 24;
        return Array.from({length:count}, (_, index) => {
          const left = (index * 37 + 11) % 100;
          const delay = -((index * .17) % 3.1);
          const duration = type === 'smog' ? 5 + ((index * 7) % 23) / 10 : 1.4 + ((index * 13) % 17) / 10;
          return `<span class="particle ${type}" style="left:${left}%;animation-delay:${delay}s;animation-duration:${duration}s"></span>`;
        }).join('');
      }

      function evaluateCERDecision(env, situation, claim) {
        const evidencePool = buildEvidencePool(situation, claim);
        const selectedCards = (savedRun.selectedEvidence || []).map(id => evidencePool.find(item => item.id === id)).filter(Boolean);
        let supportCount = 0;
        let contradictionCount = 0;
        let neutralCount = 0;
        selectedCards.forEach(card => {
          if ((card.supports || []).includes(claim.id)) supportCount++;
          else if ((card.contradicts || []).includes(claim.id)) contradictionCount++;
          else neutralCount++;
        });
        const evidenceScore = clamp(10 + supportCount * 45 + neutralCount * 5 - contradictionCount * 25, 0, 100);
        const reasoningOptions = getReasoningOptions(situation, claim);
        const reasoning = reasoningOptions.find(item => item.id === savedRun.selectedReasoning) || reasoningOptions[0];
        const reasoningScore = reasoning?.quality || 0;
        const cerScore = Math.round(evidenceScore * .55 + reasoningScore * .45);

        const selected = selectedOptions();
        const selectedIds = new Set(selected.map(option => option.id));
        const boosted = (claim.boost || []).filter(id => selectedIds.has(id));
        const penalized = (claim.penalty || []).filter(id => selectedIds.has(id));
        const pressures = mergedScenarioPressures(env, situation);
        const traitContributions = selected.map(option => {
          let value = 0;
          Object.entries(pressures).forEach(([tag,severity]) => { value += (option.effects[tag] || 0) * severity * .35; });
          if (boosted.includes(option.id)) value += 4;
          if (penalized.includes(option.id)) value -= 5;
          return {label:option.name, value:Math.round(value)};
        }).filter(item => Math.abs(item.value) >= 2).sort((a,b) => Math.abs(b.value) - Math.abs(a.value));
        const pressureFit = clamp(Math.round(traitContributions.reduce((sum,item) => sum + item.value, 0) * .38), -18, 18);
        const actionFit = boosted.length * 4 - penalized.length * 5;
        const reserve = Math.max(0, BIO_BUDGET - spentBudget());
        const reserveBonus = Math.round(reserve * .7);
        const statAverage = (savedRun.stats.population + savedRun.stats.energy + savedRun.stats.resources) / 3;
        const stateModifier = clamp(Math.round((statAverage - 62) * .08), -5, 4);
        const riskModifier = claim.risk === 'Controlled' ? 2 : claim.risk === 'Bold' ? -1 : 0;
        let score = 55 + pressureFit + actionFit + reserveBonus + stateModifier + riskModifier + Math.round((cerScore - 58) * .22);
        score = clamp(Math.round(score), 8, 98);

        const changes = {
          population: claim.effect.population || 0,
          energy: claim.effect.energy || 0,
          resources: claim.effect.resources || 0
        };
        if (score >= 85) { changes.population += 5; changes.energy += 4; changes.resources += 4; }
        else if (score >= 72) { changes.population += 2; changes.energy += 2; changes.resources += 2; }
        else if (score >= 58) { changes.population += 0; changes.energy += 0; changes.resources += 0; }
        else if (score >= 43) { changes.population -= 4; changes.energy -= 3; changes.resources -= 2; }
        else { changes.population -= 8; changes.energy -= 6; changes.resources -= 4; }

        const statsBefore = {...savedRun.stats};
        const statsAfter = {
          population: clamp(statsBefore.population + changes.population, 5, 100),
          energy: clamp(statsBefore.energy + changes.energy, 5, 100),
          resources: clamp(statsBefore.resources + changes.resources, 5, 100)
        };
        changes.population = statsAfter.population - statsBefore.population;
        changes.energy = statsAfter.energy - statsBefore.energy;
        changes.resources = statsAfter.resources - statsBefore.resources;

        let status, tierText;
        if (score >= 86) { status='Thrived'; tierText='The decision, genome, and CER worked together exceptionally well.'; }
        else if (score >= 72) { status='Adapted'; tierText='The population converted the choice into a clear survival advantage.'; }
        else if (score >= 58) { status='Endured'; tierText='The plan worked, but important biological costs remained.'; }
        else if (score >= 43) { status='Costly Survival'; tierText='The expedition continued after meaningful losses and resource stress.'; }
        else { status='Severe Setback'; tierText='The population survived, but the mismatch created major consequences.'; }

        const evidenceFeedback = supportCount === 2
          ? 'Both evidence selections directly support the claim.'
          : supportCount === 1 && contradictionCount === 0
            ? 'One selection supports the claim; the other is related but does not directly justify it.'
            : contradictionCount > 0
              ? 'At least one selected observation weakens or contradicts the claim.'
              : 'The selected observations do not directly support this claim.';
        const reasoningFeedback = reasoningScore >= 90
          ? 'The reasoning explains a cause-and-effect link between the evidence, the claim, and the creature’s biology.'
          : reasoningScore >= 50
            ? 'The reasoning is related to the claim, but the causal link is incomplete.'
            : 'The reasoning is circular or based on preference rather than biological evidence.';

        return {
          worldIndex:savedRun.worldIndex,
          situationIndex:savedRun.situationIndex,
          envId:env.id,
          situationId:situation.id,
          claimId:claim.id,
          claimText:claim.text,
          branchScene:claim.scene,
          score,
          status,
          outcome:`${claim.outcome} ${tierText}`,
          continuation:claim.continuation,
          statsBefore,
          statsAfter,
          changes,
          cer:{
            evidenceScore,
            reasoningScore,
            score:cerScore,
            evidence:selectedCards.map(item => item.text),
            reasoning:reasoning?.text || '',
            supportCount,
            contradictionCount,
            evidenceFeedback,
            reasoningFeedback
          },
          factors:traitContributions.slice(0,6),
          boosted:boosted.map(id => getOption(id)?.name || id),
          penalized:penalized.map(id => getOption(id)?.name || id)
        };
      }

      function runCERDecision() {
        if (simulationBusy || !savedRun.currentClaim || (savedRun.selectedEvidence || []).length !== 2 || !savedRun.selectedReasoning) return;
        const {env, situation} = getCurrentExpedition();
        const claim = situation?.claims.find(item => item.id === savedRun.currentClaim);
        if (!env || !situation || !claim) return;
        simulationBusy = true;
        const result = evaluateCERDecision(env, situation, claim);
        const messages = ['Recording the claim…','Checking evidence relevance…','Linking cause and effect…','Applying biological consequences…'];
        let index = 0;
        simulationText = messages[0];
        screen.innerHTML = `<section class="trial-shell">${renderWorldProgress()}<div class="trial-layout cer-layout">${renderExpeditionScene(env,situation,{branch:claim.scene,transition:true})}<aside class="panel cer-panel"><p class="eyebrow">Field decision in progress</p><h2>${escapeHTML(claim.short)}</h2><p class="muted">The CER is now interacting with the creature’s genome and current expedition state.</p>${renderMetrics()}<div class="cer-assembly"><h3>Submitted protocol</h3><div class="cer-line"><b>C</b><span>${escapeHTML(claim.text)}</span></div><div class="cer-line"><b>E</b><span>${result.cer.evidence.map(escapeHTML).join(' • ')}</span></div><div class="cer-line"><b>R</b><span>${escapeHTML(result.cer.reasoning)}</span></div></div></aside></div></section>`;
        const interval = setInterval(() => {
          index++;
          const element = document.getElementById('simulationText');
          if (element && messages[index]) element.textContent = messages[index];
        }, 430);
        setTimeout(() => {
          clearInterval(interval);
          savedRun.scenarioResults.push(result);
          savedRun.stats = result.statsAfter;
          savedRun.phase = 'decisionResult';
          saveRun();
          simulationBusy = false;
          simulationText = '';
          setView('trialResult');
        }, 1900);
      }

      function renderStatChange(label, value) {
        const sign = value > 0 ? '+' : '';
        const klass = value > 0 ? 'positive' : value < 0 ? 'negative' : 'neutral';
        return `<div class="stat-change"><span>${escapeHTML(label)}</span><strong class="${klass}">${sign}${Math.round(value)}</strong></div>`;
      }

      function renderTrialResult() {
        const result = savedRun.scenarioResults[savedRun.scenarioResults.length - 1];
        const {env, situation, claim} = getSituationByResult(result);
        if (!result || !env || !situation || !claim) { setView('trial'); return; }
        const positive = result.factors.filter(item => item.value > 0).slice(0,4);
        const negative = result.factors.filter(item => item.value < 0).slice(0,4);
        const finalSituation = result.situationIndex >= 2;
        screen.innerHTML = `
          <section class="trial-shell">
            ${renderWorldProgress()}
            <div class="trial-layout result-trial-layout">
              ${renderExpeditionScene(env,situation,{branch:result.branchScene,score:result.score,enter:true})}
              <aside class="panel result-cer-card">
                <div class="result-score-row">
                  <div><div class="score-gauge" style="--score:${result.score}"><div class="score-gauge-inner"><strong>${result.score}</strong><span>Field score</span></div></div></div>
                  <div><p class="eyebrow">CER consequence • Situation ${result.situationIndex + 1}/3</p><h2 class="result-title">${escapeHTML(result.status)}</h2><p class="result-sub">${escapeHTML(result.outcome)}</p></div>
                </div>
                <div class="stat-change-grid">${renderStatChange('Population',result.changes.population)}${renderStatChange('Energy',result.changes.energy)}${renderStatChange('Resources',result.changes.resources)}</div>
                ${renderMetrics(result.statsAfter)}
                <div class="cer-assembly">
                  <h3>Your completed CER</h3>
                  <div class="cer-line"><b>C</b><span>${escapeHTML(result.claimText)}</span></div>
                  <div class="cer-line"><b>E</b><span>${result.cer.evidence.map(text => escapeHTML(text)).join('<br>')}</span></div>
                  <div class="cer-line"><b>R</b><span>${escapeHTML(result.cer.reasoning)}</span></div>
                  <div class="cer-quality">
                    <div class="quality-card"><span>Evidence</span><strong>${result.cer.evidenceScore}</strong></div>
                    <div class="quality-card"><span>Reasoning</span><strong>${result.cer.reasoningScore}</strong></div>
                    <div class="quality-card"><span>CER quality</span><strong>${result.cer.score}</strong></div>
                  </div>
                </div>
                <div class="info-box"><strong>Evidence:</strong> ${escapeHTML(result.cer.evidenceFeedback)}<br><strong>Reasoning:</strong> ${escapeHTML(result.cer.reasoningFeedback)}</div>
                <div class="factor-strip">
                  ${positive.map(item => `<span class="factor-pill good">+ ${escapeHTML(item.label)}</span>`).join('')}
                  ${negative.map(item => `<span class="factor-pill bad">− ${escapeHTML(item.label)}</span>`).join('')}
                  ${!positive.length && !negative.length ? '<span class="factor-pill">No major genome interaction</span>' : ''}
                </div>
                <div class="result-actions"><button class="primary-btn" data-action="next-decision">${finalSituation ? 'Complete This World' : 'Continue Expedition'}</button></div>
              </aside>
            </div>
          </section>`;
      }

      function buildWorldReport(worldIndex) {
        const ref = savedRun.worlds[worldIndex];
        const env = ENVIRONMENTS.find(item => item.id === ref?.envId);
        const results = savedRun.scenarioResults.filter(item => item.worldIndex === worldIndex);
        const average = Math.round(results.reduce((sum,item) => sum + item.score,0) / Math.max(results.length,1));
        const cerAverage = Math.round(results.reduce((sum,item) => sum + item.cer.score,0) / Math.max(results.length,1));
        const start = results[0]?.statsBefore || savedRun.stats;
        const end = results[results.length - 1]?.statsAfter || savedRun.stats;
        let rank, summary;
        if (average >= 84) { rank='Dominant Adaptation'; summary='The species turned multiple pressures into advantages and left this world stronger.'; }
        else if (average >= 70) { rank='Stable Adaptation'; summary='The population handled the world effectively, with manageable costs.'; }
        else if (average >= 56) { rank='Narrow Survival'; summary='The population survived, but several decisions exposed important limitations.'; }
        else { rank='Critical Passage'; summary='The world imposed severe costs, yet the expedition continued instead of ending.'; }
        return {worldIndex,envId:env.id,average,cerAverage,start,end,rank,summary,resultIds:results.map(item => item.situationId)};
      }

      function nextDecision() {
        if (savedRun.situationIndex < 2) {
          savedRun.situationIndex += 1;
          savedRun.currentClaim = null;
          savedRun.selectedEvidence = [];
          savedRun.selectedReasoning = null;
          savedRun.phase = 'cer';
          savedRun.sceneTransition = true;
          saveRun();
          setView('trial');
          return;
        }
        const existing = savedRun.worldReports.find(item => item.worldIndex === savedRun.worldIndex);
        if (!existing) savedRun.worldReports.push(buildWorldReport(savedRun.worldIndex));
        savedRun.phase = 'worldResult';
        saveRun();
        setView('worldResult');
      }

      function renderWorldResult() {
        const report = savedRun.worldReports.find(item => item.worldIndex === savedRun.worldIndex) || buildWorldReport(savedRun.worldIndex);
        const env = ENVIRONMENTS.find(item => item.id === report.envId);
        const results = savedRun.scenarioResults.filter(item => item.worldIndex === report.worldIndex);
        const last = results[results.length - 1];
        const lastSituation = env.situations.find(item => item.id === last?.situationId) || env.situations[2];
        const finalWorld = savedRun.worldIndex >= 2;
        screen.innerHTML = `
          <section class="world-report-shell">
            ${renderWorldProgress()}
            <div class="world-report-grid">
              ${renderExpeditionScene(env,lastSituation,{branch:last?.branchScene,score:report.average,enter:true})}
              <div class="panel world-report-card">
                <p class="eyebrow">World ${report.worldIndex + 1} field report</p>
                <h2>${escapeHTML(env.name)}</h2>
                <div class="report-scoreline"><strong>${report.average}</strong><span>world survival average</span></div>
                <div class="cer-badge">CER average ${report.cerAverage} / 100</div>
                <h3 style="margin-top:16px">${escapeHTML(report.rank)}</h3>
                <p class="muted">${escapeHTML(report.summary)}</p>
                <div class="stat-change-grid">${renderStatChange('Population',report.end.population-report.start.population)}${renderStatChange('Energy',report.end.energy-report.start.energy)}${renderStatChange('Resources',report.end.resources-report.start.resources)}</div>
                <div class="decision-log">${results.map((item,index) => {
                  const info = getSituationByResult(item);
                  return `<div class="decision-log-item"><div><strong>${index + 1}. ${escapeHTML(info.situation.title)}</strong><b>${item.score}</b></div><p>${escapeHTML(info.claim.short)} • CER ${item.cer.score} • ${escapeHTML(item.status)}</p></div>`;
                }).join('')}</div>
                <div class="world-report-actions"><button class="primary-btn" data-action="next-world">${finalWorld ? 'View Final Expedition Report' : 'Enter Next World'}</button></div>
              </div>
            </div>
          </section>`;
      }

      function advanceWorld() {
        if (savedRun.worldIndex >= 2) {
          savedRun.phase = 'final';
          savedRun.completed = true;
          saveRun();
          setView('final');
          return;
        }
        savedRun.worldIndex += 1;
        savedRun.situationIndex = 0;
        savedRun.currentClaim = null;
        savedRun.selectedEvidence = [];
        savedRun.selectedReasoning = null;
        savedRun.phase = 'cer';
        savedRun.sceneTransition = true;
        saveRun();
        setView('trial');
      }

      function getFinalAssessment() {
        const results = savedRun.scenarioResults || [];
        const survivalAverage = Math.round(results.reduce((sum,item) => sum + item.score,0) / Math.max(results.length,1));
        const cerAverage = Math.round(results.reduce((sum,item) => sum + item.cer.score,0) / Math.max(results.length,1));
        const statAverage = Math.round((savedRun.stats.population + savedRun.stats.energy + savedRun.stats.resources) / 3);
        const finalScore = Math.round(survivalAverage * .6 + cerAverage * .25 + statAverage * .15);
        let rank, description;
        if (finalScore >= 88) { rank='Wildworld Systems Thinker'; description='The species survived through strong biological design and consistently connected claims to relevant evidence and causal reasoning.'; }
        else if (finalScore >= 78) { rank='Adaptive Field Strategist'; description='The expedition handled most worlds well and produced generally strong CER decisions.'; }
        else if (finalScore >= 68) { rank='Resilient Investigator'; description='The population completed every world, though some evidence or biological tradeoffs reduced performance.'; }
        else if (finalScore >= 56) { rank='Risk-Taking Specialist'; description='Several decisions worked in narrow conditions, but the expedition paid meaningful costs.'; }
        else { rank='Unstable Prototype'; description='The population completed the expedition, but weak matches among traits, evidence, and reasoning created repeated setbacks.'; }
        let classLabel = 'Experimental organism';
        if (cerAverage >= 88 && survivalAverage >= 72) classLabel = 'Evidence-guided generalist';
        else if (survivalAverage >= 82 && cerAverage < 70) classLabel = 'Instinctive survivor';
        else if (cerAverage >= 82 && survivalAverage < 68) classLabel = 'Strong analyst, fragile design';
        else if (savedRun.stats.population >= 82) classLabel = 'Expanding population';
        else if (spentBudget() <= 17 && finalScore >= 68) classLabel = 'Efficient adaptive build';
        return {finalScore,survivalAverage,cerAverage,statAverage,rank,description,classLabel};
      }

      function renderFinal() {
        if ((savedRun.worldReports || []).length < 3) { setView('worldResult'); return; }
        const assessment = getFinalAssessment();
        screen.innerHTML = `
          <section class="final-shell">
            <div class="panel final-hero">
              <div>
                <p class="eyebrow">CER Wildworld Expedition Complete</p>
                <h2>${escapeHTML(savedRun.speciesName)}</h2>
                <div class="classification">◆ ${escapeHTML(assessment.classLabel)}</div>
                <div class="final-scoreline"><strong>${assessment.finalScore}</strong><span>final expedition score / 100</span></div>
                <h3>${escapeHTML(assessment.rank)}</h3>
                <p>${escapeHTML(assessment.description)}</p>
                <div class="final-summary-grid">
                  <div class="final-summary-card"><span>Survival decisions</span><strong>${assessment.survivalAverage}</strong></div>
                  <div class="final-summary-card"><span>CER quality</span><strong>${assessment.cerAverage}</strong></div>
                  <div class="final-summary-card"><span>Final condition</span><strong>${assessment.statAverage}</strong></div>
                </div>
                <div class="review-grid">${CATEGORIES.map(category => {
                  const option = getOption(savedRun.selections[category.id]);
                  return `<div class="review-trait"><span>${escapeHTML(category.label)}</span><strong>${escapeHTML(option?.name || 'Unknown')}</strong></div>`;
                }).join('')}</div>
              </div>
              <div class="final-creature">${renderCreatureSVG(savedRun.selections,'final')}</div>
            </div>
            <div class="world-results">${savedRun.worldReports.map(report => {
              const env = ENVIRONMENTS.find(item => item.id === report.envId);
              return `<article class="world-card"><div class="world-card-head"><div><p class="eyebrow">World ${report.worldIndex + 1}</p><h3>${escapeHTML(env.name)}</h3></div><span class="world-score">${report.average}</span></div><p><strong>${escapeHTML(report.rank)}</strong> • CER ${report.cerAverage}</p><div class="mini-bar"><span style="width:${report.average}%"></span></div></article>`;
            }).join('')}</div>
            <div class="final-actions">
              <button class="secondary-btn" data-action="retest">Retest Same Creature</button>
              <button class="secondary-btn" data-action="redesign">Redesign Genome</button>
              <button class="primary-btn" data-action="new-run">Create New Species</button>
            </div>
          </section>`;
      }

            <div class="how-step"><b>4</b><div><strong>Connect them with Reasoning</strong><span>Choose the explanation that shows why the evidence makes the claim biologically effective through cause and effect.</span></div></div>
            <div class="how-step"><b>5</b><div><strong>Live with the consequence</strong><span>The genome, CER quality, current resources, and chosen action change the scene and continue the expedition.</span></div></div>
            <div class="how-step"><b>6</b><div><strong>Complete three worlds</strong><span>Each run contains nine connected situations selected from a library of twenty-four habitat-specific challenges.</span></div></div>
          </div>
          <div class="info-box"><strong>Core rule:</strong> the Claim is not graded as a single universal “right answer.” Its success depends on the creature’s traits. Evidence and Reasoning are evaluated by how well they support and explain that claim.</div>
          <div class="modal-actions"><button class="primary-btn" data-action="close-modal">Enter Lab</button></div>
        </div></div>`;
      }

      function openRestartModal() {
        modalRoot.innerHTML = `<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="restartTitle">
          <div class="modal-head"><div><p class="eyebrow">Reset expedition</p><h2 id="restartTitle">Delete current progress?</h2></div><button class="close-btn" data-action="close-modal" aria-label="Close">×</button></div>
          <p class="muted">The saved genome, CER decisions, world reports, and final expedition report on this device will be removed.</p>
          <div class="modal-actions"><button class="ghost-btn" data-action="close-modal">Cancel</button><button class="danger-btn" data-action="confirm-restart">Delete and Restart</button></div>
        </div></div>`;
      }

      function closeModal() { modalRoot.innerHTML = ''; }

      async function toggleFullscreen() {
        try {
          if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
          else await document.exitFullscreen();
        } catch (error) { showToast('Full screen is blocked by this browser setting.'); }
      }

      function resumeRun() {
        if (!savedRun) return;
        if (savedRun.completed || savedRun.phase === 'final') setView('final');
        else if (savedRun.phase === 'build') setView('build');
        else if (savedRun.phase === 'decisionResult') setView('trialResult');
        else if (savedRun.phase === 'worldResult') setView('worldResult');
        else setView('trial');
      }

      function startNewRun() {
        savedRun = freshRun();
        saveRun();
        setView('build');
      }

      function retestSameCreature() {
        savedRun.worlds = shuffle(ENVIRONMENTS).slice(0,3).map(env => ({envId:env.id,situationIds:env.situations.map(item => item.id)}));
        savedRun.worldIndex = 0;
        savedRun.situationIndex = 0;
        savedRun.currentClaim = null;
        savedRun.selectedEvidence = [];
        savedRun.selectedReasoning = null;
        savedRun.scenarioResults = [];
        savedRun.worldReports = [];
        savedRun.stats = {population:72,energy:72,resources:55};
        savedRun.completed = false;
        savedRun.sceneTransition = true;
        savedRun.phase = 'cer';
        saveRun();
        setView('trial');
      }

      function redesignGenome() {
        savedRun.phase = 'build';
        savedRun.buildStep = CATEGORIES.length;
        savedRun.worlds = [];
        savedRun.worldIndex = 0;
        savedRun.situationIndex = 0;
        savedRun.currentClaim = null;
        savedRun.selectedEvidence = [];
        savedRun.selectedReasoning = null;
        savedRun.scenarioResults = [];
        savedRun.worldReports = [];
        savedRun.stats = {population:72,energy:72,resources:55};
        savedRun.completed = false;
        savedRun.sceneTransition = false;
        saveRun();
        setView('build');
      }

      document.addEventListener('click', event => {
        if (event.target.classList?.contains('modal-backdrop')) {
          closeModal();
          return;
        }
        const target = event.target.closest('[data-action]');
        if (!target) return;
        const action = target.dataset.action;
        if (action === 'new-run') startNewRun();
        else if (action === 'continue') resumeRun();
        else if (action === 'how') openHowModal();
        else if (action === 'close-modal') closeModal();
        else if (action === 'confirm-restart') { clearRun(); closeModal(); startNewRun(); }
        else if (action === 'select-trait') {
          savedRun.selections[target.dataset.category] = target.dataset.option;
          saveRun(); render();
        }
        else if (action === 'builder-next') {
          savedRun.buildStep = clamp(savedRun.buildStep + 1, 0, CATEGORIES.length);
          saveRun(); render();
        }
        else if (action === 'builder-back') {
          savedRun.buildStep = clamp(savedRun.buildStep - 1, 0, CATEGORIES.length);
          saveRun(); render();
        }
        else if (action === 'jump-step') {
          savedRun.buildStep = Number(target.dataset.step);
          saveRun(); render();
        }
        else if (action === 'randomize') randomizeGenome();
        else if (action === 'new-name') {
          savedRun.speciesName = generateName();
          saveRun(); render();
        }
        else if (action === 'launch') beginTrials();
        else if (action === 'choose-claim') {
          savedRun.previousClaim = savedRun.currentClaim;
          savedRun.currentClaim = target.dataset.choice;
          savedRun.claimSceneTransition = true;
          savedRun.selectedEvidence = [];
          savedRun.selectedReasoning = null;
          saveRun(); render();
        }
        else if (action === 'toggle-evidence') {
          const id = target.dataset.evidence;
          const selected = savedRun.selectedEvidence || [];
          if (selected.includes(id)) savedRun.selectedEvidence = selected.filter(item => item !== id);
          else if (selected.length < 2) savedRun.selectedEvidence = [...selected,id];
          else { showToast('Select only two pieces of evidence.'); return; }
          if (savedRun.selectedEvidence.length < 2) savedRun.selectedReasoning = null;
          saveRun(); render();
        }
        else if (action === 'choose-reasoning') {
          savedRun.selectedReasoning = target.dataset.reasoning;
          saveRun(); render();
        }
        else if (action === 'run-cer') runCERDecision();
        else if (action === 'next-decision') nextDecision();
        else if (action === 'next-world') advanceWorld();
        else if (action === 'retest') retestSameCreature();
        else if (action === 'redesign') redesignGenome();
      });

      document.addEventListener('input', event => {
        if (event.target.id === 'speciesName' && savedRun) {
          savedRun.speciesName = event.target.value.slice(0,24);
          saveRun();
          updateHeader();
        }
      });

      document.getElementById('homeButton').addEventListener('click', () => setView('home'));
      document.getElementById('helpButton').addEventListener('click', openHowModal);
      document.getElementById('restartButton').addEventListener('click', openRestartModal);
      document.getElementById('fullscreenButton').addEventListener('click', toggleFullscreen);
      document.addEventListener('fullscreenchange', () => {
        const btn = document.getElementById('fullscreenButton');
        if (btn) btn.innerHTML = document.fullscreenElement ? '<span class="help-label">Exit Full Screen</span><span aria-hidden="true"> ⛶</span>' : '<span class="help-label">Full Screen</span><span aria-hidden="true"> ⛶</span>';
      });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && modalRoot.innerHTML) closeModal();
      });


      document.addEventListener('pointermove', event => {
        const scene = event.target.closest?.('[data-parallax-scene="true"]');
        if (!scene) return;
        const rect = scene.getBoundingClientRect();
        const nx = ((event.clientX - rect.left) / rect.width - .5) * 2;
        const ny = ((event.clientY - rect.top) / rect.height - .5) * 2;
        scene.style.setProperty('--parallax-far-x', `${(nx * -7).toFixed(2)}px`);
        scene.style.setProperty('--parallax-far-y', `${(ny * -4).toFixed(2)}px`);
        scene.style.setProperty('--parallax-mid-x', `${(nx * -13).toFixed(2)}px`);
        scene.style.setProperty('--parallax-mid-y', `${(ny * -7).toFixed(2)}px`);
        scene.style.setProperty('--parallax-near-x', `${(nx * -22).toFixed(2)}px`);
        scene.style.setProperty('--parallax-near-y', `${(ny * -11).toFixed(2)}px`);
      });

      document.addEventListener('pointerout', event => {
        const scene = event.target.closest?.('[data-parallax-scene="true"]');
        if (!scene || scene.contains(event.relatedTarget)) return;
        ['--parallax-far-x','--parallax-far-y','--parallax-mid-x','--parallax-mid-y','--parallax-near-x','--parallax-near-y'].forEach(name => scene.style.setProperty(name,'0px'));
      });

      render();
    })();
  </script>
</body>
</html>
