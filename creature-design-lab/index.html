<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07151b" />
  <title>Creature Design Lab — CER Evidence Worlds</title>
  <style>
    :root {
      --bg: #061117;
      --bg-2: #0a1c24;
      --panel: rgba(13, 35, 44, 0.88);
      --panel-2: rgba(20, 48, 58, 0.9);
      --line: rgba(157, 226, 222, 0.18);
      --line-strong: rgba(157, 226, 222, 0.38);
      --text: #effffc;
      --muted: #a8c7c7;
      --accent: #61f2cc;
      --accent-2: #a6ff75;
      --warning: #ffd166;
      --danger: #ff7676;
      --good: #76f39b;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      --radius: 22px;
      --radius-sm: 14px;
      --topbar: 68px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 16% 12%, rgba(50, 183, 171, 0.12), transparent 32rem),
        radial-gradient(circle at 88% 84%, rgba(142, 218, 74, 0.08), transparent 30rem),
        linear-gradient(155deg, #061117 0%, #071a21 46%, #041015 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }

    button, input { font: inherit; }
    button { color: inherit; }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(97, 242, 204, 0.55);
      outline-offset: 3px;
    }

    .app { min-height: 100vh; position: relative; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      min-height: var(--topbar);
      padding: 10px clamp(14px, 2.4vw, 34px);
      display: flex;
      align-items: center;
      gap: 18px;
      background: rgba(5, 17, 23, 0.84);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(18px);
    }

    .brand {
      border: 0;
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      text-align: left;
      min-width: max-content;
    }

    .brand-mark {
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #042119;
      font-weight: 950;
      letter-spacing: -0.08em;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 26px rgba(97, 242, 204, 0.2);
    }

    .brand-copy strong {
      display: block;
      font-size: 0.92rem;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .brand-copy span {
      display: block;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 2px;
    }

    .top-status {
      flex: 1;
      display: flex;
      justify-content: center;
      min-width: 0;
    }

    .status-pill {
      max-width: 500px;
      padding: 8px 13px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.025);
      font-size: 0.8rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .top-actions { display: flex; gap: 8px; }

    .icon-btn,
    .small-btn,
    .ghost-btn,
    .primary-btn,
    .secondary-btn,
    .danger-btn {
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, opacity 150ms ease;
    }

    .icon-btn,
    .small-btn {
      min-height: 42px;
      padding: 9px 12px;
      background: rgba(255,255,255,0.035);
      color: var(--muted);
    }

    .icon-btn:hover,
    .small-btn:hover,
    .ghost-btn:hover,
    .secondary-btn:hover {
      transform: translateY(-1px);
      border-color: var(--line-strong);
      background: rgba(255,255,255,0.065);
      color: var(--text);
    }

    .primary-btn,
    .secondary-btn,
    .ghost-btn,
    .danger-btn {
      min-height: 48px;
      padding: 12px 18px;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .primary-btn {
      border-color: transparent;
      color: #042019;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 10px 30px rgba(97, 242, 204, 0.16);
    }

    .primary-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

    .secondary-btn { background: rgba(97, 242, 204, 0.08); color: var(--accent); }
    .ghost-btn { background: transparent; color: var(--muted); }
    .danger-btn { background: rgba(255, 118, 118, 0.09); color: #ffadad; border-color: rgba(255, 118, 118, 0.25); }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none !important;
      filter: none !important;
    }

    .screen {
      width: min(1500px, 100%);
      min-height: calc(100vh - var(--topbar));
      margin: 0 auto;
      padding: clamp(20px, 3vw, 44px);
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1, h2, h3, p { margin-top: 0; }
    h1 { font-size: clamp(2.55rem, 6vw, 5.8rem); line-height: 0.92; letter-spacing: -0.065em; }
    h2 { font-size: clamp(1.7rem, 3vw, 3rem); line-height: 1; letter-spacing: -0.04em; }
    h3 { font-size: 1.08rem; }
    .muted { color: var(--muted); }

    .home-grid {
      min-height: calc(100vh - var(--topbar) - 2 * clamp(20px, 3vw, 44px));
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(430px, 1.05fr);
      align-items: center;
      gap: clamp(30px, 6vw, 90px);
    }

    .home-copy { max-width: 690px; }
    .home-title span { color: var(--accent); }
    .home-lede { max-width: 630px; font-size: clamp(1rem, 1.35vw, 1.22rem); line-height: 1.65; color: #c0d7d7; }

    .home-actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .home-actions .primary-btn { min-width: 210px; }

    .feature-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
    .feature-chip {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,0.025);
      font-size: 0.82rem;
    }

    .resume-card {
      margin-top: 23px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border: 1px solid rgba(97, 242, 204, 0.23);
      border-radius: 16px;
      background: rgba(97, 242, 204, 0.06);
      max-width: 620px;
    }

    .resume-card strong { display: block; font-size: 0.95rem; }
    .resume-card span { color: var(--muted); font-size: 0.8rem; }

    .tank-wrap {
      position: relative;
      min-height: 520px;
      display: grid;
      place-items: center;
    }

    .tank-glow {
      position: absolute;
      width: 76%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(97,242,204,0.18), transparent 68%);
      filter: blur(10px);
    }

    .tank {
      width: min(100%, 680px);
      min-height: 500px;
      position: relative;
      display: grid;
      place-items: center;
      border: 1px solid rgba(134, 242, 224, 0.28);
      border-radius: 42% 42% 25% 25% / 24% 24% 17% 17%;
      background:
        linear-gradient(180deg, rgba(83, 205, 193, 0.07), rgba(6, 24, 30, 0.65)),
        repeating-linear-gradient(90deg, transparent 0 48px, rgba(117, 226, 215, 0.025) 49px 50px);
      box-shadow: inset 0 0 70px rgba(97,242,204,0.08), var(--shadow);
      overflow: hidden;
    }

    .tank::before,
    .tank::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      height: 9px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(97,242,204,0.7), transparent);
      box-shadow: 0 0 22px rgba(97,242,204,0.4);
    }

    .tank::before { top: 8%; }
    .tank::after { bottom: 7%; }

    .tank-label {
      position: absolute;
      left: 72px;
      top: 22px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(3, 15, 20, 0.55);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .creature-svg { width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 18px 20px rgba(0,0,0,0.25)); }
    .tank .creature-svg { width: 92%; max-width: 620px; animation: float 4s ease-in-out infinite; }

    @keyframes float { 50% { transform: translateY(-9px); } }

    .builder-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(360px, 0.75fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(145deg, rgba(15, 38, 47, 0.92), rgba(8, 26, 33, 0.88));
      box-shadow: var(--shadow);
    }

    .builder-main { padding: clamp(20px, 2.4vw, 34px); }
    .preview-panel { padding: 18px; position: sticky; top: calc(var(--topbar) + 18px); }

    .builder-topline {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 22px;
    }

    .step-kicker { color: var(--accent); font-weight: 800; font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; }
    .builder-topline h2 { margin: 5px 0 7px; }
    .builder-topline p { color: var(--muted); margin-bottom: 0; max-width: 680px; }

    .budget-box {
      min-width: 168px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(0,0,0,0.15);
    }

    .budget-line { display: flex; justify-content: space-between; gap: 10px; font-size: 0.78rem; color: var(--muted); }
    .budget-line strong { color: var(--text); }
    .budget-bar { height: 8px; margin-top: 9px; border-radius: 999px; background: rgba(255,255,255,0.07); overflow: hidden; }
    .budget-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width 250ms ease; }
    .budget-fill.over { background: linear-gradient(90deg, var(--warning), var(--danger)); }

    .category-nav {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin-bottom: 22px;
    }

    .category-step {
      min-width: 0;
      padding: 9px 6px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255,255,255,0.025);
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      font-size: 0.72rem;
      transition: 150ms ease;
    }

    .category-step .step-number {
      width: 21px;
      height: 21px;
      margin: 0 auto 5px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      font-weight: 900;
      font-size: 0.67rem;
    }

    .category-step.active { color: var(--text); border-color: rgba(97,242,204,0.5); background: rgba(97,242,204,0.08); }
    .category-step.done .step-number { color: #042019; background: var(--accent); }

    .trait-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .trait-card {
      position: relative;
      min-height: 145px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 17px;
      background: rgba(255,255,255,0.025);
      text-align: left;
      cursor: pointer;
      transition: transform 150ms ease, border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }

    .trait-card:hover { transform: translateY(-2px); border-color: var(--line-strong); background: rgba(255,255,255,0.045); }
    .trait-card.selected { border-color: rgba(97,242,204,0.66); background: linear-gradient(145deg, rgba(97,242,204,0.12), rgba(166,255,117,0.045)); box-shadow: inset 0 0 0 1px rgba(97,242,204,0.12); }

    .trait-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .trait-card h3 { margin: 0; }
    .cost-chip { flex: 0 0 auto; padding: 4px 8px; border-radius: 999px; background: rgba(255,209,102,0.11); color: var(--warning); font-size: 0.72rem; font-weight: 900; }
    .trait-card p { margin: 9px 0 11px; color: var(--muted); font-size: 0.85rem; line-height: 1.45; }
    .trait-effects { display: flex; flex-wrap: wrap; gap: 6px; }
    .effect-good, .effect-bad { padding: 4px 7px; border-radius: 8px; font-size: 0.69rem; font-weight: 750; }
    .effect-good { color: #a9f7bb; background: rgba(118,243,155,0.08); }
    .effect-bad { color: #ffb2b2; background: rgba(255,118,118,0.08); }

    .builder-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .builder-footer-group { display: flex; gap: 9px; flex-wrap: wrap; }

    .preview-stage {
      min-height: 360px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--line);
      background:
        radial-gradient(circle at 50% 45%, rgba(97,242,204,0.14), transparent 45%),
        linear-gradient(180deg, rgba(21, 54, 64, 0.8), rgba(7, 25, 31, 0.9));
    }

    .preview-stage::before {
      content: "GENOME PREVIEW";
      position: absolute;
      left: 14px;
      top: 13px;
      color: rgba(192, 222, 221, 0.56);
      font-size: 0.68rem;
      font-weight: 900;
      letter-spacing: 0.14em;
    }

    .preview-stage .creature-svg { width: 95%; max-width: 540px; }

    .genome-summary { margin-top: 14px; display: grid; gap: 8px; }
    .summary-row { display: flex; justify-content: space-between; gap: 14px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.025); font-size: 0.78rem; }
    .summary-row span { color: var(--muted); }
    .summary-row strong { text-align: right; }

    .review-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
      margin-top: 16px;
    }

    .review-trait {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: rgba(255,255,255,0.025);
      cursor: pointer;
    }

    .review-trait span { display: block; color: var(--muted); font-size: 0.69rem; text-transform: uppercase; letter-spacing: 0.09em; }
    .review-trait strong { display: block; margin-top: 4px; }

    .name-field { margin-top: 16px; }
    .name-field label { display: block; color: var(--muted); font-size: 0.78rem; margin-bottom: 7px; }
    .name-row { display: flex; gap: 8px; }
    .name-field input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: rgba(0,0,0,0.22);
    }

    .warning-box, .info-box {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .warning-box { color: #ffe8ad; background: rgba(255,209,102,0.09); border: 1px solid rgba(255,209,102,0.2); }
    .info-box { color: #bcefe5; background: rgba(97,242,204,0.07); border: 1px solid rgba(97,242,204,0.16); }

    .trial-shell { display: grid; gap: 18px; }

    .trial-progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .trial-node {
      position: relative;
      padding: 11px 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--muted);
      background: rgba(255,255,255,0.025);
      font-size: 0.78rem;
    }

    .trial-node strong { display: block; color: inherit; }
    .trial-node.active { color: var(--text); border-color: rgba(97,242,204,0.5); background: rgba(97,242,204,0.08); }
    .trial-node.done { color: #bcefc8; border-color: rgba(118,243,155,0.25); }

    .trial-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(360px, 0.65fr);
      gap: 18px;
      align-items: start;
    }

    .result-trial-layout {
      grid-template-columns: minmax(0, 0.92fr) minmax(560px, 1.08fr);
    }

    .habitat-scene {
      min-height: 535px;
      height: clamp(535px, calc(100vh - var(--topbar) - 150px), 650px);
      position: sticky;
      top: calc(var(--topbar) + 18px);
      overflow: hidden;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .habitat-scene::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(180deg, transparent 55%, rgba(0,0,0,0.35));
      z-index: 7;
    }

    .scene-sky, .scene-ground, .scene-decor, .weather-layer, .field-creature { position: absolute; }
    .scene-sky { inset: 0; z-index: 0; }
    .scene-ground { left: -5%; right: -5%; bottom: -8%; height: 37%; z-index: 2; }
    .scene-decor { inset: 0; z-index: 3; pointer-events: none; }
    .weather-layer { inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }

    .field-creature {
      width: min(48%, 500px);
      left: 25%;
      bottom: 11%;
      z-index: 6;
      transform-origin: 50% 100%;
      filter: drop-shadow(0 20px 14px rgba(0,0,0,0.42));
    }

    .habitat-scene.sim-running .field-creature { animation: trialMove 2.45s ease-in-out both; }
    @keyframes trialMove {
      0% { transform: translateX(-14%) scale(0.96); }
      35% { transform: translateX(8%) scale(1.02) rotate(-1deg); }
      70% { transform: translateX(-3%) scale(0.98) rotate(1deg); }
      100% { transform: translateX(10%) scale(1); }
    }

    .scene-desert .scene-sky { background: linear-gradient(#ffb05d, #d96245 55%, #8f3d3a); }
    .scene-desert .scene-sky::before { content:""; position:absolute; width:110px; height:110px; border-radius:50%; right:10%; top:10%; background:#ffe69b; box-shadow:0 0 45px #ffd17b; }
    .scene-desert .scene-ground { background: radial-gradient(ellipse at 30% 20%, #efad5c 0 32%, transparent 33%), radial-gradient(ellipse at 70% 18%, #d98647 0 38%, transparent 39%), linear-gradient(#cf7044,#8d3f37); border-radius: 50% 50% 0 0; }

    .scene-polar .scene-sky { background: linear-gradient(#8ec9e5, #bfdce7 58%, #89a9ba); }
    .scene-polar .scene-ground { background: linear-gradient(170deg, #e8fbff 0 42%, #9fc7da 43% 60%, #f1feff 61%); clip-path: polygon(0 38%, 17% 21%, 35% 43%, 56% 12%, 75% 40%, 100% 21%, 100% 100%, 0 100%); }

    .scene-mangrove .scene-sky { background: linear-gradient(#3d8f91, #235f67 54%, #163d4c); }
    .scene-mangrove .scene-ground { background: linear-gradient(rgba(64,175,169,0.75), #164956); height: 30%; box-shadow: inset 0 15px 22px rgba(168,255,227,0.12); }

    .scene-cavern .scene-sky { background: radial-gradient(circle at 50% 55%, #1e4450, #09141c 68%); }
    .scene-cavern .scene-ground { background: linear-gradient(#23343b,#0a1116); clip-path: polygon(0 25%, 18% 5%, 35% 24%, 52% 2%, 73% 22%, 100% 7%, 100% 100%, 0 100%); }

    .scene-canopy .scene-sky { background: linear-gradient(#58a96e, #1c684f 52%, #11443c); }
    .scene-canopy .scene-ground { background: linear-gradient(#315a38,#0e2d29); clip-path: polygon(0 35%, 18% 24%, 35% 42%, 57% 18%, 74% 39%, 100% 22%, 100% 100%, 0 100%); }

    .scene-caldera .scene-sky { background: linear-gradient(#692e2e, #241c23 55%, #100f15); }
    .scene-caldera .scene-ground { background: linear-gradient(170deg, #282329 0 44%, #fb6b35 45% 49%, #19161b 50% 70%, #ff8c42 71% 74%, #151319 75%); clip-path: polygon(0 25%, 17% 12%, 31% 31%, 48% 7%, 66% 26%, 82% 10%, 100% 27%, 100% 100%, 0 100%); }

    .scene-metro .scene-sky { background: linear-gradient(#584578, #25284f 55%, #10182c); }
    .scene-metro .scene-ground { background: linear-gradient(#343541,#11151f); height: 28%; }

    .scene-highlands .scene-sky { background: linear-gradient(#70a4b8, #637b8f 55%, #394a5a); }
    .scene-highlands .scene-ground { background: linear-gradient(165deg,#a6bbc0,#4b6671 48%,#263f4d 49%); clip-path: polygon(0 42%, 16% 13%, 31% 38%, 52% 4%, 70% 40%, 87% 16%, 100% 36%, 100% 100%, 0 100%); }

    .tree-trunk { position:absolute; bottom:22%; width:35px; height:62%; background:linear-gradient(90deg,#173c30,#385b3a,#123126); border-radius:45% 35% 10% 10%; }
    .tree-trunk::before { content:""; position:absolute; width:170px; height:100px; border-radius:50%; background:rgba(39,113,61,0.86); left:-68px; top:-30px; box-shadow:60px 25px 0 rgba(27,91,57,0.75), -45px 25px 0 rgba(38,124,68,0.7); }
    .mangrove-root { position:absolute; bottom:18%; width:18px; height:250px; background:#302e27; transform:rotate(22deg); border-radius:50%; transform-origin:bottom; }
    .building { position:absolute; bottom:27%; width:100px; background:linear-gradient(#343a5a,#1b2239); border:1px solid rgba(255,255,255,0.08); box-shadow:inset 0 0 0 6px rgba(0,0,0,0.12); }
    .building::after { content:""; position:absolute; inset:15px; background:repeating-linear-gradient(90deg, rgba(255,220,130,0.5) 0 7px, transparent 8px 19px), repeating-linear-gradient(0deg, rgba(255,220,130,0.45) 0 6px, transparent 7px 20px); opacity:.5; }
    .stalactite { position:absolute; top:-1px; width:52px; height:150px; background:linear-gradient(#17262c,#293c42); clip-path:polygon(0 0,100% 0,56% 100%); }
    .ash-spire { position:absolute; bottom:23%; width:80px; height:190px; background:#211c22; clip-path:polygon(50% 0,100% 100%,0 100%); }

    .particle { position:absolute; top:-12%; width:5px; height:5px; border-radius:50%; opacity:.75; animation:fall linear infinite; }
    @keyframes fall { to { transform:translateY(720px) translateX(35px) rotate(180deg); } }
    .rain { width:2px; height:24px; border-radius:2px; background:rgba(190,255,249,0.55); }
    .snow { background:#fff; box-shadow:0 0 8px rgba(255,255,255,.7); }
    .ash { background:#42343a; }
    .dust { background:#ffc181; }

    .scene-info {
      position: absolute;
      left: 18px;
      right: 18px;
      top: 18px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      pointer-events: none;
    }

    .scene-label {
      padding: 10px 12px;
      border-radius: 12px;
      color: white;
      background: rgba(4, 16, 20, 0.56);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(10px);
      text-shadow: 0 2px 10px rgba(0,0,0,0.35);
    }

    .scene-label span { display:block; font-size:.68rem; text-transform:uppercase; letter-spacing:.12em; opacity:.75; }
    .scene-label strong { display:block; margin-top:3px; font-size:1rem; }

    .simulation-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(3, 13, 17, 0.54);
      backdrop-filter: blur(5px);
    }

    .simulation-card {
      width: min(430px, 92%);
      padding: 24px;
      text-align: center;
      border: 1px solid rgba(97,242,204,0.34);
      border-radius: 20px;
      background: rgba(7, 25, 31, 0.9);
      box-shadow: 0 25px 70px rgba(0,0,0,0.35);
    }

    .scan-ring {
      width: 74px;
      height: 74px;
      margin: 0 auto 16px;
      border: 4px solid rgba(97,242,204,0.14);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .trial-panel { padding: 23px; display: flex; flex-direction: column; min-height: 535px; }
    .trial-panel h2 { margin-bottom: 9px; }
    .event-card { margin: 6px 0 14px; padding: 12px 13px; border-left: 3px solid var(--warning); border-radius: 0 12px 12px 0; background: rgba(255,209,102,0.07); }
    .event-card strong { display:block; margin-bottom:4px; }
    .event-card span { color: var(--muted); font-size: .82rem; line-height:1.45; }

    .challenge-row { display:flex; flex-wrap:wrap; gap:7px; margin: 5px 0 16px; }
    .challenge-chip { padding: 6px 9px; border-radius:999px; background:rgba(255,255,255,.045); border:1px solid var(--line); color:#c9dddd; font-size:.72rem; }
    .challenge-chip b { color:var(--warning); letter-spacing:.08em; }

    .population-box { margin-bottom: 16px; padding: 11px 12px; border:1px solid var(--line); border-radius:13px; background:rgba(0,0,0,.13); }
    .population-head { display:flex; justify-content:space-between; gap:12px; color:var(--muted); font-size:.76rem; }
    .population-head strong { color:var(--text); }
    .population-bar { height:9px; margin-top:9px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.07); }
    .population-fill { height:100%; border-radius:inherit; background:linear-gradient(90deg,#57cfce,#9efa78); transition:width .35s ease; }

    .action-label { margin-bottom:9px; color:var(--muted); font-size:.75rem; font-weight:850; text-transform:uppercase; letter-spacing:.1em; }
    .action-list { display:grid; gap:9px; }
    .action-card { padding:13px; border:1px solid var(--line); border-radius:13px; background:rgba(255,255,255,.025); cursor:pointer; text-align:left; transition:150ms ease; }
    .action-card:hover { border-color:var(--line-strong); background:rgba(255,255,255,.05); }
    .action-card.selected { border-color:rgba(97,242,204,.6); background:rgba(97,242,204,.09); }
    .action-card strong { display:flex; justify-content:space-between; gap:12px; }
    .action-card strong span { color:var(--accent); font-size:.68rem; text-transform:uppercase; letter-spacing:.08em; }
    .action-card p { margin:6px 0 0; color:var(--muted); font-size:.79rem; line-height:1.4; }
    .trial-cta { margin-top:auto; padding-top:16px; }
    .trial-cta .primary-btn { width:100%; }

    .result-card { padding: 22px; }
    .result-layout { display:grid; grid-template-columns:minmax(230px,.65fr) minmax(0,1.35fr); gap:24px; align-items:center; }
    .score-gauge { width:210px; aspect-ratio:1; margin:0 auto; display:grid; place-items:center; border-radius:50%; position:relative; background:conic-gradient(var(--accent) calc(var(--score) * 1%), rgba(255,255,255,.065) 0); }
    .score-gauge::before { content:""; position:absolute; inset:14px; border-radius:50%; background:#0a2028; box-shadow:inset 0 0 28px rgba(0,0,0,.28); }
    .score-gauge-inner { position:relative; z-index:1; text-align:center; }
    .score-gauge strong { display:block; font-size:3.3rem; line-height:1; letter-spacing:-.06em; }
    .score-gauge span { color:var(--muted); font-size:.74rem; text-transform:uppercase; letter-spacing:.12em; }
    .result-title { margin-bottom:8px; }
    .result-sub { color:var(--muted); line-height:1.55; }

    .factor-columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:17px; }
    .factor-box { padding:13px; border-radius:13px; border:1px solid var(--line); background:rgba(255,255,255,.025); }
    .factor-box h3 { margin-bottom:9px; font-size:.82rem; text-transform:uppercase; letter-spacing:.09em; }
    .factor-list { display:grid; gap:7px; }
    .factor-item { display:flex; justify-content:space-between; gap:12px; font-size:.78rem; }
    .factor-item span:first-child { color:var(--muted); }
    .positive { color:var(--good); }
    .negative { color:var(--danger); }
    .neutral { color:var(--warning); }
    .result-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; flex-wrap:wrap; }

    .final-shell { display:grid; gap:18px; }
    .final-hero { padding: clamp(24px,3vw,42px); display:grid; grid-template-columns:minmax(0,1fr) minmax(340px,.58fr); gap:30px; align-items:center; }
    .final-scoreline { display:flex; align-items:flex-end; gap:14px; margin:15px 0; }
    .final-scoreline strong { font-size:clamp(4rem,9vw,7rem); line-height:.78; letter-spacing:-.08em; color:var(--accent); }
    .final-scoreline span { color:var(--muted); padding-bottom:5px; }
    .final-hero p { color:var(--muted); line-height:1.6; max-width:720px; }
    .classification { display:inline-flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid rgba(166,255,117,.25); border-radius:999px; color:#c8ffa9; background:rgba(166,255,117,.07); font-weight:850; font-size:.78rem; }
    .final-creature { min-height:340px; display:grid; place-items:center; border:1px solid var(--line); border-radius:20px; background:radial-gradient(circle,rgba(97,242,204,.12),transparent 60%); }
    .final-creature .creature-svg { width:95%; }

    .world-results { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
    .world-card { padding:17px; border:1px solid var(--line); border-radius:17px; background:rgba(255,255,255,.025); }
    .world-card-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .world-card h3 { margin:0; }
    .world-score { font-size:1.75rem; font-weight:950; color:var(--accent); }
    .world-card p { margin:8px 0 0; color:var(--muted); font-size:.82rem; line-height:1.45; }
    .mini-bar { height:7px; margin-top:13px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.07); }
    .mini-bar span { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent-2)); }
    .final-actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; padding:5px 0 8px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      padding: 20px;
      display: grid;
      place-items: center;
      background: rgba(1, 8, 11, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal {
      width: min(620px, 100%);
      max-height: min(760px, 92vh);
      overflow:auto;
      padding: 24px;
      border: 1px solid var(--line-strong);
      border-radius: 22px;
      background: #0b222b;
      box-shadow: 0 30px 90px rgba(0,0,0,.48);
    }

    .modal-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
    .modal-head h2 { font-size:1.7rem; }
    .close-btn { width:38px; height:38px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.035); cursor:pointer; }
    .how-grid { display:grid; gap:10px; margin-top:16px; }
    .how-step { display:grid; grid-template-columns:36px 1fr; gap:12px; padding:12px; border-radius:13px; background:rgba(255,255,255,.025); border:1px solid var(--line); }
    .how-step b { width:31px; height:31px; display:grid; place-items:center; border-radius:10px; color:#042019; background:var(--accent); }
    .how-step strong { display:block; margin-bottom:4px; }
    .how-step span { color:var(--muted); font-size:.84rem; line-height:1.45; }
    .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      z-index: 120;
      transform: translate(-50%, 18px);
      padding: 10px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      color: var(--text);
      background: rgba(8, 29, 36, 0.95);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: 220ms ease;
      font-size: .82rem;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }

    .sr-only { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; white-space:nowrap !important; border:0 !important; }

    @media (max-width: 1050px) {
      .home-grid, .builder-shell, .trial-layout, .final-hero { grid-template-columns: 1fr; }
      .home-grid { padding-top: 25px; }
      .tank-wrap { min-height: 430px; }
      .tank { min-height: 420px; }
      .preview-panel { position: static; }
      .preview-stage { min-height: 330px; }
      .trial-panel { min-height: auto; }
      .result-trial-layout { grid-template-columns: 1fr; }
      .habitat-scene { min-height: 480px; height: 480px; max-height: none; position: relative; top: auto; }
      .final-creature { min-height:300px; }
    }

    @media (max-width: 760px) {
      .screen { padding: 16px; }
      .brand-copy span, .top-status, .help-label { display:none; }
      .topbar { gap:9px; padding:9px 12px; }
      .top-actions { margin-left:auto; }
      .icon-btn { padding:8px 10px; }
      .home-grid { min-height:auto; }
      .tank-wrap { min-height:340px; }
      .tank { min-height:330px; }
      .category-nav { grid-template-columns: repeat(4,1fr); }
      .trait-grid, .review-grid, .factor-columns, .world-results, .result-layout { grid-template-columns:1fr; }
      .builder-topline { flex-direction:column; }
      .budget-box { width:100%; }
      .habitat-scene { min-height:390px; height:390px; }
      .field-creature { width:65%; left:17%; }
      .trial-progress { gap:6px; }
      .trial-node { padding:8px; font-size:.69rem; }
      .scene-info { left:10px; right:10px; top:10px; }
      .result-actions, .modal-actions { justify-content:stretch; }
      .result-actions button, .modal-actions button { flex:1; }
      .final-scoreline strong { font-size:4.8rem; }
    }


    /* CER expedition expansion */
    .cer-layout { grid-template-columns: minmax(0, 1.08fr) minmax(430px, .92fr); }
    .cer-panel {
      min-height: 535px;
      max-height: clamp(535px, calc(100vh - var(--topbar) - 150px), 650px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(97,242,204,.35) transparent;
      padding: 21px;
    }
    .cer-panel::-webkit-scrollbar { width: 8px; }
    .cer-panel::-webkit-scrollbar-thumb { background: rgba(97,242,204,.28); border-radius: 999px; }
    .expedition-kicker { display:flex; justify-content:space-between; gap:12px; align-items:center; }
    .situation-count { color:var(--muted); font-size:.72rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .situation-card {
      margin: 8px 0 14px;
      padding: 13px 14px;
      border: 1px solid rgba(255,209,102,.2);
      border-left: 3px solid var(--warning);
      border-radius: 0 13px 13px 0;
      background: linear-gradient(135deg, rgba(255,209,102,.075), rgba(255,255,255,.02));
    }
    .situation-card strong { display:block; margin-bottom:5px; font-size:.9rem; }
    .situation-card p { margin:0; color:var(--muted); font-size:.79rem; line-height:1.48; }
    .continuity-card {
      margin: 0 0 12px;
      padding: 10px 12px;
      display:flex;
      gap:10px;
      align-items:flex-start;
      border-radius:12px;
      border:1px solid rgba(97,242,204,.17);
      background:rgba(97,242,204,.055);
      color:#c7eee7;
      font-size:.76rem;
      line-height:1.45;
    }
    .continuity-card b { color:var(--accent); flex:0 0 auto; }
    .metric-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; margin:0 0 14px; }
    .metric-card { padding:9px 10px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.13); }
    .metric-head { display:flex; justify-content:space-between; gap:8px; color:var(--muted); font-size:.68rem; text-transform:uppercase; letter-spacing:.07em; }
    .metric-head strong { color:var(--text); font-size:.76rem; }
    .metric-bar { height:6px; margin-top:7px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.07); }
    .metric-bar span { display:block; height:100%; border-radius:inherit; transition:width .45s ease; }
    .metric-pop .metric-bar span { background:linear-gradient(90deg,#62d7d3,#9efa78); }
    .metric-energy .metric-bar span { background:linear-gradient(90deg,#60a9ff,#8be6ff); }
    .metric-resource .metric-bar span { background:linear-gradient(90deg,#ffd166,#f3a45a); }
    .cer-steps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:2px 0 13px; }
    .cer-step {
      padding:8px 9px;
      display:flex;
      gap:8px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:11px;
      color:var(--muted);
      background:rgba(255,255,255,.02);
      font-size:.68rem;
      font-weight:850;
      text-transform:uppercase;
      letter-spacing:.08em;
    }
    .cer-step b { width:22px; height:22px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.06); color:inherit; }
    .cer-step.active { color:var(--text); border-color:rgba(97,242,204,.45); background:rgba(97,242,204,.08); }
    .cer-step.done { color:#c6f7ce; border-color:rgba(118,243,155,.22); }
    .cer-section { padding:13px; border:1px solid var(--line); border-radius:14px; background:rgba(255,255,255,.018); }
    .cer-section + .cer-section { margin-top:10px; }
    .cer-section.locked { opacity:.55; }
    .cer-section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:9px; }
    .cer-letter {
      width:29px; height:29px; flex:0 0 auto; display:grid; place-items:center;
      border-radius:9px; color:#042019; background:linear-gradient(135deg,var(--accent),var(--accent-2));
      font-weight:950;
    }
    .cer-section-copy { flex:1; min-width:0; }
    .cer-section-copy strong { display:block; font-size:.82rem; }
    .cer-section-copy span { display:block; margin-top:2px; color:var(--muted); font-size:.71rem; line-height:1.35; }
    .selection-counter { flex:0 0 auto; color:var(--accent); font-size:.7rem; font-weight:900; }
    .claim-list, .reasoning-list { display:grid; gap:8px; }
    .claim-card, .reasoning-card, .evidence-card {
      width:100%; text-align:left; cursor:pointer; border:1px solid var(--line); color:var(--text);
      background:rgba(255,255,255,.025); transition:transform 150ms ease,border-color 150ms ease,background 150ms ease;
    }
    .claim-card:hover, .reasoning-card:hover, .evidence-card:hover { transform:translateY(-1px); border-color:var(--line-strong); background:rgba(255,255,255,.05); }
    .claim-card { padding:11px 12px; border-radius:12px; }
    .claim-card.selected, .reasoning-card.selected, .evidence-card.selected { border-color:rgba(97,242,204,.62); background:rgba(97,242,204,.09); box-shadow:inset 0 0 0 1px rgba(97,242,204,.08); }
    .claim-title { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .claim-title strong { font-size:.82rem; line-height:1.3; }
    .risk-chip { flex:0 0 auto; color:var(--accent); font-size:.61rem; font-weight:900; letter-spacing:.09em; text-transform:uppercase; }
    .claim-card p { margin:5px 0 0; color:var(--muted); font-size:.72rem; line-height:1.4; }
    .evidence-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .evidence-card { min-height:86px; position:relative; padding:10px 11px 10px 34px; border-radius:12px; }
    .evidence-index { position:absolute; left:9px; top:9px; width:19px; height:19px; display:grid; place-items:center; border-radius:6px; background:rgba(255,255,255,.07); color:var(--muted); font-size:.66rem; font-weight:950; }
    .evidence-card.selected .evidence-index { color:#042019; background:var(--accent); }
    .evidence-source { display:block; margin-bottom:4px; color:var(--warning); font-size:.58rem; font-weight:900; letter-spacing:.1em; text-transform:uppercase; }
    .evidence-card p { margin:0; color:#d9eeee; font-size:.7rem; line-height:1.38; }
    .reasoning-card { position:relative; padding:10px 11px 10px 34px; border-radius:12px; color:#d9eeee; font-size:.72rem; line-height:1.42; }
    .reasoning-card::before { content:'R'; position:absolute; left:9px; top:10px; width:18px; height:18px; display:grid; place-items:center; border-radius:6px; color:var(--muted); background:rgba(255,255,255,.07); font-size:.62rem; font-weight:950; }
    .reasoning-card.selected::before { color:#042019; background:var(--accent); }
    .cer-submit { margin-top:11px; }
    .cer-submit .primary-btn { width:100%; }
    .locked-message { padding:9px 10px; border-radius:10px; color:var(--muted); background:rgba(0,0,0,.13); font-size:.7rem; }

    .scene-tone-hot::before, .scene-tone-cold::before, .scene-tone-wet::before, .scene-tone-night::before,
    .scene-tone-hazard::before, .scene-tone-green::before, .scene-tone-urban::before {
      content:''; position:absolute; inset:0; z-index:4; pointer-events:none; mix-blend-mode:soft-light; opacity:.45;
    }
    .scene-tone-hot::before { background:radial-gradient(circle at 74% 17%,rgba(255,220,117,.72),transparent 28%),linear-gradient(rgba(255,98,50,.2),transparent); }
    .scene-tone-cold::before { background:linear-gradient(rgba(103,190,255,.22),rgba(224,250,255,.05)); }
    .scene-tone-wet::before { background:linear-gradient(rgba(44,205,192,.12),rgba(6,75,85,.24)); }
    .scene-tone-night::before { background:linear-gradient(rgba(12,18,55,.1),rgba(2,7,20,.62)); }
    .scene-tone-hazard::before { background:radial-gradient(circle at 50% 60%,rgba(255,110,65,.18),transparent 45%),linear-gradient(rgba(102,30,54,.32),rgba(15,7,18,.32)); }
    .scene-tone-green::before { background:radial-gradient(circle at 40% 20%,rgba(179,255,108,.24),transparent 38%); }
    .scene-tone-urban::before { background:linear-gradient(135deg,rgba(140,92,255,.22),rgba(20,224,228,.08)); }
    .scene-stage-dawn .scene-sky { filter:brightness(1.12) saturate(1.08); }
    .scene-stage-dusk .scene-sky { filter:brightness(.72) saturate(1.2) hue-rotate(10deg); }
    .scene-stage-storm .scene-sky, .scene-stage-hazard .scene-sky { filter:brightness(.62) saturate(.85); }
    .scene-stage-dark .scene-sky { filter:brightness(.48); }
    .scene-stage-glow .scene-sky { filter:brightness(.78) saturate(1.35); }

    .habitat-scene.scene-25d-ready {

    .scene-25d, .scene-near-25d {
      position: absolute;
      inset: 0;
      pointer-events: none;
      transform-style: preserve-3d;
      overflow: hidden;
    }
    .scene-25d { z-index: 4; }
    .scene-near-25d { z-index: 9; }
    .depth-layer {
      position: absolute;
      inset: -6%;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform .78s cubic-bezier(.2,.72,.2,1), filter .6s ease;
    }
    .depth-layer svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .depth-far {
      transform: translate3d(calc(var(--focus-far) + var(--parallax-far-x)), var(--parallax-far-y), -135px) scale(1.17);
      opacity: .94;
    }
    .depth-mid {
      transform: translate3d(calc(var(--focus-mid) + var(--parallax-mid-x)), var(--parallax-mid-y), -28px) scale(1.07);
    }
    .depth-near {
      transform: translate3d(calc(var(--focus-near) + var(--parallax-near-x)), var(--parallax-near-y), 85px) scale(1.045);
      filter: drop-shadow(0 22px 20px rgba(0,0,0,.3));

    .world-far-art { opacity: .92; }

    .scene-depth-haze {
      position: absolute; left: -5%; right: -5%; bottom: 14%; height: 34%; z-index: 2;
      background: linear-gradient(180deg, transparent, var(--scene-haze));
      filter: blur(11px); opacity: .58;

    .scene-lighting {
      position: absolute; inset: 0; z-index: 5;

        linear-gradient(180deg, rgba(255,255,255,.03), transparent 42%, rgba(0,0,0,.17));

    .route-path {
      fill: none; stroke: rgba(221,255,246,.34); stroke-width: 5;

    .decision-landmark {
      --landmark-scale: .92;

      width: clamp(118px, 21%, 164px);
      transform: translate(-50%,-50%) translateZ(var(--landmark-z)) rotateX(-4deg) scale(var(--landmark-scale));

      filter: saturate(.78) brightness(.84);

      pointer-events: none;
      transform-style: preserve-3d;
      transform: translate3d(calc(var(--focus-mid) + var(--parallax-mid-x)), var(--parallax-mid-y), 34px) scale(1.015);
      transition: transform .78s cubic-bezier(.2,.72,.2,1);
    }
    .field-clue {
      --clue-scale: 1;
      position: absolute;
      left: var(--clue-x);
      top: var(--clue-y);
      width: clamp(76px, 12.5%, 108px);
      aspect-ratio: 1.28;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--scene-accent);
      cursor: pointer;
      pointer-events: auto;
      transform: translate(-50%,-50%) translateZ(var(--clue-z)) rotateX(-7deg) rotateZ(var(--clue-tilt)) scale(var(--clue-scale));
      transform-origin: 50% 92%;
      filter: drop-shadow(0 15px 12px rgba(0,0,0,.42));
      transition: transform .28s ease, filter .28s ease, opacity .28s ease;
      animation: none;
    }
    @keyframes clueBreathe {
      from { transform: translate(-50%,-50%) translateZ(var(--clue-z)) rotateX(-7deg) rotateZ(var(--clue-tilt)) scale(var(--clue-scale)); }
      to { transform: translate(-50%,calc(-50% - 4px)) translateZ(var(--clue-z)) rotateX(-5deg) rotateZ(var(--clue-tilt)) scale(calc(var(--clue-scale) * 1.015)); }
    }
    .field-clue:hover,
    .field-clue:focus-visible,
    .field-clue.linked-hover,
    .field-clue.open {
      --clue-scale: 1.12;
      z-index: 14;
      outline: none;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.5)) drop-shadow(0 0 13px var(--scene-glow));
    }
    .field-clue.selected {
      --clue-scale: 1.08;
      z-index: 13;
      filter: drop-shadow(0 18px 18px rgba(0,0,0,.5)) drop-shadow(0 0 18px var(--scene-accent));
    }
    .field-clue.selected .field-clue-art {
      filter: saturate(1.35) brightness(1.13);
    }
    .field-clue-art {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
      transition: filter .28s ease, transform .28s ease;
      transform-origin: 50% 78%;
      animation: clueArtFloat 3.4s ease-in-out infinite alternate;
      animation-delay: var(--clue-delay);
    }
    @keyframes clueArtFloat { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    .field-clue-marker {
      position: absolute;
      right: -7px;
      top: -7px;
      min-width: 34px;
      height: 34px;
      padding: 0 7px;
      display: grid;
      place-items: center;
      border: 2px solid rgba(239,255,251,.82);
      border-radius: 999px;
      color: #effffc;
      background: rgba(4,18,23,.92);
      box-shadow: 0 8px 18px rgba(0,0,0,.42), inset 0 0 0 2px rgba(255,255,255,.05);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .02em;
    }
    .field-clue.selected .field-clue-marker {
      color: #052019;
      background: var(--scene-accent);
      border-color: #effffc;
    }
    .field-clue.selected .field-clue-marker::after {
      content: '✓';
      position: absolute;
      right: -8px;
      bottom: -7px;
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #052019;
      background: #effffc;
      font-size: 12px;
      font-weight: 950;
      box-shadow: 0 4px 8px rgba(0,0,0,.35);
    }
    .field-clue::after {
      content: '';
      position: absolute;
      left: 16%;
      right: 16%;
      bottom: -5px;
      height: 9px;
      border-radius: 50%;
      background: rgba(0,0,0,.28);
      filter: blur(4px);
      z-index: -1;
    }

    .field-scan-readout {
      position: absolute;
      left: 29%;
      right: 29%;
      top: 13px;
      z-index: 13;
      min-height: 58px;
      padding: 9px 13px;
      display: grid;
      align-content: center;
      border: 1px solid rgba(234,255,250,.2);
      border-radius: 13px;
      color: #dff8f4;
      background: linear-gradient(145deg, rgba(4,18,23,.9), rgba(8,31,38,.78));
      box-shadow: 0 12px 28px rgba(0,0,0,.3), inset 0 0 24px rgba(97,242,204,.035);
      backdrop-filter: blur(10px);
      pointer-events: none;
      transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
    }
    .field-scan-readout.active {
      border-color: rgba(97,242,204,.58);
      box-shadow: 0 14px 30px rgba(0,0,0,.38), inset 0 0 28px rgba(97,242,204,.08), 0 0 0 2px rgba(97,242,204,.08);
      transform: translateY(2px);
    }
    .field-scan-readout strong {
      display: block;
      color: var(--scene-accent);
      font-size: 14px;
      font-weight: 950;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .field-scan-readout span {
      display: block;
      margin-top: 3px;
      color: #e8fbf7;
      font-size: 14px;
      line-height: 1.3;
    }
    .field-scan-readout .scan-help {
      color: #bad3d3;
    }
    .field-scan-legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 13;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 999px;
      color: #d9efec;
      background: rgba(4,16,21,.76);
      backdrop-filter: blur(8px);
      font-size: 14px;
      font-weight: 750;
      pointer-events: none;
    }

    .scene-detail-texture {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: .36;
      mix-blend-mode: overlay;
      background:
        radial-gradient(circle at 17% 26%, rgba(255,255,255,.12) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 38%, rgba(255,255,255,.08) 0 1px, transparent 2px),
        repeating-linear-gradient(101deg, transparent 0 18px, rgba(255,255,255,.025) 19px 20px);
      background-size: 58px 58px, 76px 76px, auto;
    }

    .evidence-card {
      display: grid;
      grid-template-columns: 62px minmax(0,1fr);
      align-items: center;
      gap: 10px;
      padding: 12px 12px 12px 39px;
      min-height: 122px;
    }
    .evidence-thumb {
      width: 62px;
      height: 56px;
      display: grid;
      place-items: center;
      color: var(--accent);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      overflow: hidden;
      background: radial-gradient(circle at 50% 22%, rgba(255,255,255,.09), rgba(3,16,21,.78));
      box-shadow: inset 0 0 18px rgba(97,242,204,.035);
    }
    .evidence-thumb .field-clue-art { width: 72px; height: 58px; }
    .evidence-thumb svg { width: 100%; height: 100%; display: block; }
    .evidence-content { min-width: 0; display: block; }
    .evidence-index {
      width: 25px;
      height: 25px;
      font-size: 12px;
    }
    .evidence-pick {
      position: absolute;
      right: 9px;
      top: 9px;
      padding: 4px 7px;
      border-radius: 999px;
      color: #052019;
      background: var(--accent);
      font-size: 12px;
      font-weight: 950;
      box-shadow: 0 6px 14px rgba(0,0,0,.25);
    }
    .evidence-card[data-clue-id]:hover .evidence-thumb,
    .evidence-card[data-clue-id]:focus-visible .evidence-thumb,
    .evidence-card.selected .evidence-thumb {
      border-color: rgba(97,242,204,.58);
      box-shadow: inset 0 0 18px rgba(97,242,204,.08), 0 0 14px rgba(97,242,204,.13);
    }
    .evidence-card .evidence-source { margin-right: 42px; }

    @media (max-width: 1180px) {
      .field-scan-readout { left: 24%; right: 24%; }
      .field-clue { width: clamp(72px, 11.5%, 98px); }
    }
    @media (max-width: 760px) {
      .field-scan-readout {
        left: 10px;
        right: 10px;
        top: 73px;
        min-height: 58px;
      }
      .field-scan-legend { left: 9px; bottom: 8px; font-size: 12px; }
      .field-clue { width: clamp(62px, 15%, 82px); }
      .decision-landmark { width: 28%; }
      .evidence-card { grid-template-columns: 54px minmax(0,1fr); }
      .evidence-thumb { width: 54px; height: 50px; }
    }

  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="Return to main menu">
        <span class="brand-mark">CD</span>
        <span class="brand-copy"><strong>Creature Design Lab</strong><span>CER Evidence Worlds</span></span>
      </button>
      <div class="top-status" id="topStatus"></div>
      <div class="top-actions">
        <button class="icon-btn" id="helpButton"><span class="help-label">How to Play</span><span aria-hidden="true"> ?</span></button>
        <button class="icon-btn" id="restartButton" title="Restart experiment" aria-label="Restart experiment">↻</button>
        <button class="icon-btn" id="fullscreenButton"><span class="help-label">Full Screen</span><span aria-hidden="true"> ⛶</span></button>
      </div>
    </header>
    <main class="screen" id="screen"></main>
    <div id="modalRoot"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script>
    (() => {
      'use strict';

      const STORAGE_KEY = 'creature-design-lab-cer-wildworld-v3-evidence';
      const BIO_BUDGET = 20;

      const TAG_LABELS = {
        heat: 'Extreme heat', cold: 'Deep cold', arid: 'Water scarcity', wet: 'Saturated ground',
        flood: 'Flooding', dark: 'Low light', vertical: 'Vertical terrain', open: 'Open terrain',
        scarcity: 'Food scarcity', toxins: 'Toxins', predators: 'Predators', disease: 'Disease pressure',
        wind: 'High winds', storm: 'Severe weather', lowOxygen: 'Low oxygen', debris: 'Unstable debris',
        plants: 'Plant food', prey: 'Mobile prey', mixed: 'Mixed food', urban: 'Artificial terrain'
      };

      const CATEGORIES = [
        {
          id: 'body', label: 'Body Plan', prompt: 'Choose the frame that everything else must support.',
          options: [
            { id:'tiny', name:'Compact Frame', cost:1, desc:'Low food demand and quick movement, but loses heat fast.', good:['Low food demand','Agile'], bad:['Cold','Predators'], effects:{heat:1,scarcity:2,vertical:1,cold:-2,predators:-1,wind:-1} },
            { id:'balanced', name:'Balanced Frame', cost:2, desc:'No extreme advantage, but few severe weaknesses.', good:['Stable','Flexible'], bad:['No major specialty'], effects:{heat:.5,cold:.5,debris:.5,scarcity:.5,wet:.5} },
            { id:'massive', name:'Massive Frame', cost:4, desc:'Stores heat and resists attack, but needs constant fuel.', good:['Cold','Defense'], bad:['Heat','Food demand'], effects:{cold:2,predators:2,debris:1,heat:-2,scarcity:-2,vertical:-2,lowOxygen:-1} },
            { id:'longlimbed', name:'Long-Limbed Frame', cost:3, desc:'Reaches, climbs, and crosses rough ground efficiently.', good:['Vertical terrain','Reach'], bad:['Wind','Debris'], effects:{vertical:2,open:1,wet:1,cold:-1,wind:-1,debris:-1} }
          ]
        },
        {
          id: 'surface', label: 'Surface', prompt: 'Select the outer layer that handles climate and damage.',
          options: [
            { id:'fur', name:'Insulating Fur', cost:3, desc:'Excellent thermal protection with a serious heat cost.', good:['Cold','Wind'], bad:['Heat','Wet climate'], effects:{cold:3,wind:1,heat:-3,wet:-1,disease:-1} },
            { id:'scales', name:'Reflective Scales', cost:2, desc:'Reflects heat and slows water loss.', good:['Heat','Dry climate'], bad:['Cold'], effects:{heat:2,arid:2,wet:1,cold:-2} },
            { id:'shell', name:'Armored Shell', cost:4, desc:'Heavy protection against impact, attack, and contamination.', good:['Predators','Debris'], bad:['Climbing','Food demand'], effects:{predators:3,debris:3,toxins:1,scarcity:-1,vertical:-2,flood:-1} },
            { id:'membrane', name:'Moist Membrane', cost:1, desc:'Breathes through a thin surface that must stay damp.', good:['Wet climate','Floods'], bad:['Dry climate','Toxins'], effects:{wet:3,flood:1,heat:1,arid:-3,cold:-1,toxins:-2,disease:-1} }
          ]
        },
        {
          id: 'movement', label: 'Movement', prompt: 'Decide how the creature crosses its environment.',
          options: [
            { id:'runner', name:'Sprinting Legs', cost:3, desc:'Explosive speed on open ground; poor in rubble and water.', good:['Open terrain','Escape'], bad:['Floods','Debris'], effects:{open:3,predators:1,scarcity:1,debris:-2,vertical:-1,flood:-2} },
            { id:'climber', name:'Climbing Grips', cost:3, desc:'Hooks and gripping pads dominate walls, trees, and ruins.', good:['Vertical terrain','Debris'], bad:['Open terrain','Wind'], effects:{vertical:3,debris:2,wet:1,open:-1,wind:-1} },
            { id:'glider', name:'Gliding Wings', cost:4, desc:'Crosses gaps and floods, but violent wind becomes dangerous.', good:['Vertical terrain','Floods'], bad:['Storms','Wind'], effects:{vertical:2,flood:2,predators:1,wind:-2,storm:-3,dark:-1} },
            { id:'swimmer', name:'Webbed Fins', cost:2, desc:'Fast and stable in water; awkward on steep dry terrain.', good:['Floods','Wet climate'], bad:['Dry climate','Cliffs'], effects:{flood:3,wet:3,storm:1,arid:-3,vertical:-2,open:-1} },
            { id:'burrower', name:'Burrowing Claws', cost:3, desc:'Builds shelter from heat, cold, and impact; floods are lethal.', good:['Dry climate','Cold'], bad:['Floods','Low oxygen'], effects:{arid:2,cold:2,dark:1,debris:1,flood:-3,lowOxygen:-1} }
          ]
        },
        {
          id: 'feeding', label: 'Feeding', prompt: 'Choose what keeps the population supplied with energy.',
          options: [
            { id:'grazer', name:'Specialized Grazer', cost:1, desc:'Efficient when plant growth is reliable, vulnerable when it is not.', good:['Plant food','Efficiency'], bad:['Scarcity','Cities'], effects:{plants:3,mixed:1,scarcity:-2,urban:-1} },
            { id:'hunter', name:'Active Hunter', cost:3, desc:'High-energy feeding that depends on finding and catching prey.', good:['Mobile prey','Defense'], bad:['Scarcity','Disease'], effects:{prey:3,predators:1,scarcity:-1,disease:-1} },
            { id:'omnivore', name:'Flexible Omnivore', cost:3, desc:'Uses many food sources without mastering any single one.', good:['Mixed food','Scarcity'], bad:['High cost'], effects:{mixed:3,urban:2,scarcity:2,plants:1,prey:1} },
            { id:'scavenger', name:'Resource Scavenger', cost:2, desc:'Finds value in leftovers and artificial environments.', good:['Cities','Scarcity'], bad:['Disease','Toxins'], effects:{urban:3,scarcity:2,mixed:1,toxins:-1,disease:-2} }
          ]
        },
        {
          id: 'sense', label: 'Primary Sense', prompt: 'Select the signal the creature trusts most.',
          options: [
            { id:'night', name:'Night Vision', cost:2, desc:'Large light-sensitive eyes reveal threats in darkness.', good:['Darkness','Predators'], bad:['No sound mapping'], effects:{dark:3,predators:1} },
            { id:'thermal', name:'Heat Sensing', cost:2, desc:'Tracks warm bodies through darkness and cover.', good:['Predators','Darkness'], bad:['Extreme heat','Storms'], effects:{dark:2,cold:1,predators:2,heat:-1,storm:-1} },
            { id:'smell', name:'Chemical Tracking', cost:2, desc:'Locates food over distance, but airborne hazards disrupt it.', good:['Food scarcity','Darkness'], bad:['Toxins','Storms'], effects:{scarcity:2,mixed:1,prey:1,dark:1,toxins:-1,storm:-1} },
            { id:'echo', name:'Echolocation', cost:3, desc:'Maps complex spaces precisely; wind and storms scatter signals.', good:['Darkness','Debris'], bad:['Wind','Storms'], effects:{dark:3,debris:2,vertical:1,wind:-2,storm:-2,open:-1} }
          ]
        },
        {
          id: 'social', label: 'Social Pattern', prompt: 'Decide how individuals cooperate—or avoid one another.',
          options: [
            { id:'solitary', name:'Solitary', cost:1, desc:'Low competition and low disease spread, but limited defense.', good:['Scarcity','Disease'], bad:['Predators','Cold'], effects:{scarcity:2,disease:2,predators:-1,cold:-1} },
            { id:'pair', name:'Bonded Pair', cost:2, desc:'Two individuals share defense and care with moderate demands.', good:['Balanced support'], bad:['Few extreme bonuses'], effects:{predators:1,scarcity:1,cold:1,disease:.5} },
            { id:'pack', name:'Coordinated Pack', cost:3, desc:'Powerful hunting and defense with a large food requirement.', good:['Predators','Prey'], bad:['Scarcity','Disease'], effects:{predators:3,prey:2,cold:1,scarcity:-2,disease:-1} },
            { id:'colony', name:'Dense Colony', cost:3, desc:'Shares heat and labor, while illness spreads rapidly.', good:['Cold','Defense'], bad:['Disease','Scarcity'], effects:{cold:3,debris:1,predators:1,disease:-3,scarcity:-2,heat:-1} }
          ]
        },
        {
          id: 'special', label: 'Signature Trait', prompt: 'Add one costly adaptation that can change the entire trial.',
          options: [
            { id:'reservoir', name:'Water Reservoir', cost:2, desc:'Stores water and reduces heat stress between feeding periods.', good:['Dry climate','Heat'], bad:['Cold','Floods'], effects:{arid:4,heat:2,scarcity:1,cold:-1,flood:-1} },
            { id:'camouflage', name:'Adaptive Camouflage', cost:3, desc:'Shifts pattern to break the body outline in changing terrain.', good:['Predators','Open terrain'], bad:['Energy cost'], effects:{predators:4,open:1,vertical:1,urban:1,storm:-1} },
            { id:'filters', name:'Toxin Filters', cost:3, desc:'Neutralizes pollutants, spores, and contaminated food.', good:['Toxins','Disease'], bad:['Food demand'], effects:{toxins:5,disease:2,scarcity:-1} },
            { id:'repair', name:'Rapid Tissue Repair', cost:4, desc:'Recovers from injury quickly, but consumes enormous energy.', good:['Debris','Storms'], bad:['Food scarcity'], effects:{debris:3,predators:2,storm:2,disease:1,scarcity:-3} }
          ]
        }
      ];

      const ENVIRONMENTS = [
        {
          id:'desert', code:'V-03', name:'The Glass Dunes', intro:'A mineral desert where heat, wind, and water scarcity change by the hour.',
          challenges:{heat:3,arid:3,scarcity:2,open:2,predators:1}, weather:'dust',
          situations:[
            {
              id:'desert-water', title:'The Vanishing Basin', scene:'dawn', tone:'hot', weather:'none',
              question:'Which water source should the population use first?',
              situation:'At sunrise, the scouts locate three possible water sources. The heat will make only one early trip practical.',
              pressures:{heat:2,arid:3,scarcity:1},
              evidence:[
                {id:'d-w1', text:'Fresh tracks from several species converge on the exposed mineral spring.', supports:['spring','trail'], contradicts:[]},
                {id:'d-w2', text:'The spring is 1.4 kilometers away across open salt flats.', supports:['spring'], contradicts:['dew']},
                {id:'d-w3', text:'Broad desert leaves hold droplets before the sun reaches them.', supports:['dew'], contradicts:[]},
                {id:'d-w4', text:'The dew plants are scattered, so the population would need to feed in small groups.', supports:['dew'], contradicts:['spring']},
                {id:'d-w5', text:'A slow-moving herd repeatedly disappears behind a line of shaded rocks.', supports:['trail'], contradicts:[]},
                {id:'d-w6', text:'Following another species may reveal water, but it also increases predator exposure.', supports:['trail'], contradicts:['spring','dew']}
              ],
              claims:[
                {id:'spring', text:'The population should travel directly to the mineral spring.', short:'Mineral spring', risk:'Bold', desc:'Reach a large water source before surface temperatures peak.', boost:['runner','longlimbed','scales','reservoir','pack'], penalty:['massive','fur','membrane'], effect:{population:1,energy:-8,resources:14}, reasoning:'a concentrated water source can restore the whole population, but only if its movement and heat-control traits can handle the exposed crossing.', outcome:'The population commits to a fast crossing toward the spring.', continuation:'The spring restores water reserves, but the open route leaves the group visible on the flats.', scene:'water'},
                {id:'dew', text:'The population should harvest dew from the desert plants.', short:'Dew plants', risk:'Controlled', desc:'Collect smaller amounts nearby before they evaporate.', boost:['tiny','grazer','solitary','pair','membrane'], penalty:['massive','pack','colony'], effect:{population:2,energy:-2,resources:7}, reasoning:'nearby droplets reduce travel and heat exposure, while smaller social groups can gather from scattered plants without exhausting one patch.', outcome:'Individuals spread among the dew plants and gather water at first light.', continuation:'The group remains close to shelter, although its water supply is limited and dispersed.', scene:'feed'},
                {id:'trail', text:'The population should follow the herd toward hidden water.', short:'Follow the herd', risk:'Adaptive', desc:'Use the behavior of other animals as environmental evidence.', boost:['smell','night','camouflage','scavenger','pair'], penalty:['grazer','colony','shell'], effect:{population:0,energy:-4,resources:10}, reasoning:'repeated animal movement can reveal a protected water source, especially when tracking and concealment reduce the risk of following competitors.', outcome:'The population shadows the herd through the rock shadows.', continuation:'The herd leads toward a narrow basin, bringing both water access and nearby predators.', scene:'move'}
              ]
            },
            {
              id:'desert-storm', title:'Glasswind Warning', scene:'storm', tone:'hazard', weather:'dust',
              question:'Which route should the population take before the glasswind arrives?',
              situation:'A wall of abrasive dust is moving toward the basin. Three routes lead away, but each exposes a different weakness.',
              pressures:{storm:3,debris:2,arid:1,open:2},
              evidence:[
                {id:'d-s1', text:'The canyon blocks most crosswind, but loose stone covers its floor.', supports:['canyon'], contradicts:['flat']},
                {id:'d-s2', text:'The shortest route crosses smooth salt flats with no shelter.', supports:['flat'], contradicts:['canyon','burrow']},
                {id:'d-s3', text:'The storm front is moving faster than walking speed.', supports:['flat','burrow'], contradicts:[]},
                {id:'d-s4', text:'Compact dunes can be excavated quickly, but the air below them becomes stale.', supports:['burrow'], contradicts:['flat']},
                {id:'d-s5', text:'Abrasive particles damage exposed membranes and eyes.', supports:['canyon','burrow'], contradicts:['flat']},
                {id:'d-s6', text:'The canyon exit lies beyond a field of unstable rock shards.', supports:['canyon'], contradicts:['burrow']}
              ],
              claims:[
                {id:'canyon', text:'The population should move through the sheltered canyon.', short:'Sheltered canyon', risk:'Balanced', desc:'Trade unstable ground for protection from the strongest wind.', boost:['climber','shell','echo','repair','longlimbed'], penalty:['runner','glider','swimmer'], effect:{population:0,energy:-5,resources:-1}, reasoning:'the canyon reduces direct wind and abrasion, while climbing, mapping, or impact-resistant traits can manage the unstable debris.', outcome:'The population enters the canyon as the first dust reaches the rim.', continuation:'The storm passes overhead, but falling stone forces the group onto a higher ledge.', scene:'shelter'},
                {id:'flat', text:'The population should sprint across the salt flats.', short:'Salt-flat sprint', risk:'Bold', desc:'Attempt to outrun the front on the shortest path.', boost:['runner','tiny','scales','night','pack'], penalty:['massive','fur','shell','glider'], effect:{population:-2,energy:-12,resources:2}, reasoning:'a short exposed route can work only when speed, low mass, and heat tolerance allow the population to clear the flats before the storm overtakes it.', outcome:'The population accelerates across the open salt flats.', continuation:'The front catches the slowest individuals, separating the group near a field of black rocks.', scene:'open'},
                {id:'burrow', text:'The population should dig in and wait beneath the dunes.', short:'Dune shelter', risk:'Controlled', desc:'Avoid travel and build temporary cover before impact.', boost:['burrower','tiny','reservoir','solitary','filters'], penalty:['massive','colony','glider'], effect:{population:1,energy:-3,resources:-4}, reasoning:'buried shelter reduces abrasion and wind exposure, but the design must tolerate limited air and have enough stored energy to wait safely.', outcome:'The population excavates shallow chambers and seals the entrances.', continuation:'The storm covers the burrows, preserving the group but delaying its search for food.', scene:'low'}
              ]
            },
            {
              id:'desert-food', title:'The Last Feeding Window', scene:'dusk', tone:'night', weather:'none',
              question:'What should the population eat before the desert night begins?',
              situation:'Water has been found, but energy reserves are falling. Three food sources appear before darkness brings new predators.',
              pressures:{scarcity:3,predators:2,dark:2,heat:1},
              evidence:[
                {id:'d-f1', text:'Seed pods are abundant but protected by hard, fibrous shells.', supports:['seeds'], contradicts:['insects']},
